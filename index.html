<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co-hortdinate</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;
  --brand:#0f766e;--brand-soft:#ccfbf1;
  --need:#dc2626;--need-soft:#fee2e2;--host:#16a34a;--host-soft:#dcfce7;
  --home:#2563eb;--home-soft:#dbeafe;--away:#7c3aed;--away-soft:#ede9fe;
  --prog:#d97706;--prog-soft:#fef3c7;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 14px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header .row{display:flex;gap:8px;margin-top:8px}
header select{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 8px;font:inherit}
header select option{color:#000}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
button{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.link{background:none;color:var(--brand);padding:4px 6px}
button.danger{background:none;color:var(--need);padding:4px 6px}
button:disabled{opacity:.5}
.flex{display:flex;gap:8px;align-items:center}
.flex>*{min-width:0}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:9px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
.banner{background:var(--prog-soft);border:1px solid #fcd34d;color:#78350f;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.err{background:var(--need-soft);color:#7f1d1d;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.summary{display:flex;gap:8px;margin-bottom:12px}
.summary div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-size:22px}
.day{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;margin-bottom:6px}
.day.short{border-left-color:var(--need)}
.day.ok{border-left-color:var(--host)}
.day.quiet{border-left-color:#d6d3d1}
.dayhead{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.dayhead .d{width:92px;font-weight:600}
.dayhead .d small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dayhead .s{flex:1;font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.need{background:var(--need-soft);color:var(--need)}
.pill.host{background:var(--host-soft);color:var(--host)}
.pill.home{background:var(--home-soft);color:var(--home)}
.pill.away{background:var(--away-soft);color:var(--away)}
.pill.prog{background:var(--prog-soft);color:#92400e}
.pill.ph{background:#f5f5f4;color:var(--muted);font-weight:500}
.detail{padding:4px 12px 12px;border-top:1px solid var(--line)}
.detail h4{margin:10px 0 4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#f5f5f4;border-radius:8px;padding:3px 8px;font-size:13px}
.chip small{color:var(--muted)}
.plan{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.plan .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan .d{width:64px;font-weight:600;font-size:14px}
.seg{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}
.seg button{background:#f5f5f4;color:var(--ink);padding:6px 8px;font-size:13px;border-radius:7px}
.seg button.x{background:none;color:var(--muted);padding:6px 4px}
.seg button.on.need{background:var(--need);color:#fff}
.seg button.on.host{background:var(--host);color:#fff}
.seg button.on.home{background:var(--home);color:#fff}
.seg button.on.away{background:var(--away);color:#fff}
.hostrow{display:flex;gap:8px;align-items:center;margin-top:7px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{padding:4px 11px;background:var(--host-soft);color:var(--host);font-weight:700}
.stepper b{min-width:18px;text-align:center}
.kidrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kidrow:last-child{border-bottom:0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:2px;background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:8px;display:inline-block}
.prog{border-left:4px solid var(--prog)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 10px}
.holrow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.holrow input{padding:7px;font-size:13px}
.center{text-align:center}
.spin{padding:40px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wkhead,.week{display:grid;gap:4px;margin-bottom:4px}
.wkhead span{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.wklabel{font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1.1}
.wklabel .pill{font-size:10px;padding:1px 5px;align-self:flex-start}
.cell{min-width:0;min-height:62px;overflow:hidden;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:4px 5px;display:flex;flex-direction:column;align-items:stretch;text-align:left;font-size:12px;gap:0;cursor:pointer}
.cell.out{background:transparent;border:1px dashed #e7e5e4;cursor:default}
.cell .n{font-weight:600;font-size:12px;display:flex;gap:3px;align-items:baseline}
.cell .n small{font-weight:500;color:var(--muted);font-size:10px}
.cell .big{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.cell .mini{display:flex;gap:3px;justify-content:center;min-height:14px}
.cell .mini i{font-style:normal;font-size:10px;font-weight:700;border-radius:5px;padding:0 4px}
.cell .mini .dn{background:var(--need-soft);color:var(--need)}
.cell .mini .ds{background:var(--host-soft);color:var(--host)}
.cell .mini .dp{background:var(--prog-soft);color:#92400e}
.cell.short{background:#fef2f2;border-color:#fca5a5}.cell.short .big{color:var(--need)}
.cell.ok{background:#f0fdf4;border-color:#86efac}.cell.ok .big{color:var(--host)}
.cell.spare{background:#eff6ff;border-color:#93c5fd}.cell.spare .big{color:var(--home)}
.pill.spare{background:var(--home-soft);color:var(--home)}
.card.spare{border-left:4px solid var(--home)}
.cell.ph{background:#f5f5f4}.cell.ph .big{color:var(--muted);font-size:12px}
.cell.sel{outline:3px solid var(--brand);outline-offset:1px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;padding:12px;border-top:3px solid var(--brand)}
@media (min-width:600px){.cell{min-height:72px}.cell .big{font-size:20px}}

</style>
</head>

<header id="hdr"></header>
<main id="app"><div class="spin">Loading…</div></main>
<nav id="nav" hidden></nav>

<script type="module">
// ─────────────────────────────────────────────────────────────
// CONFIG — paste your Supabase project URL + anon (publishable) key.
// Leave blank to run in DEMO MODE (sample data, stored in this browser only).
// ─────────────────────────────────────────────────────────────
const CONFIG = {
  SUPABASE_URL: 'https://tbbwotwysaioqrvzczgw.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_Aj9xj5am6RdAnmXbhfl6Wg_vYu5RY7-',
};

// Official NZ Ministry of Education holiday dates. Term 1 start / Term 4 end vary
// by school, so group admins can adjust these under Group → Holiday dates.
const DEFAULT_HOLIDAYS = [
  { name: 'Summer 2026/27', start_date: '2026-12-19', end_date: '2027-02-02',
    note: 'Schools finish by Fri 18 Dec and restart between Thu 28 Jan and Wed 3 Feb — set to your school' },
  { name: 'Autumn break 2027', start_date: '2027-04-10', end_date: '2027-04-26', note: 'Anzac Day observed Mon 26 Apr' },
  { name: 'Winter break 2027', start_date: '2027-07-03', end_date: '2027-07-18', note: '' },
  { name: 'Spring break 2027', start_date: '2027-09-25', end_date: '2027-10-10', note: '' },
  { name: 'Summer 2027/28', start_date: '2027-12-18', end_date: '2028-02-01',
    note: 'Provisional — Term 4 ends by Fri 17 Dec; 2028 Term 1 start still to confirm' },
];

// Public holidays (Auckland) falling inside the holiday periods — most parents are off work these days
const PUBLIC_HOLIDAYS = {
  '2026-12-25': 'Christmas', '2026-12-28': 'Boxing Day (obs.)', '2027-01-01': "New Year's Day",
  '2027-01-04': 'Day after New Year (obs.)', '2027-02-01': 'Auckland Anniversary', '2027-04-26': 'Anzac Day (obs.)',
  '2027-12-27': 'Christmas (obs.)', '2027-12-28': 'Boxing Day (obs.)', '2028-01-03': "New Year's (obs.)",
  '2028-01-04': 'Day after New Year (obs.)', '2028-01-31': 'Auckland Anniversary',
};

const STATUS = {
  need: { label: 'Need care', short: 'Need' },
  host: { label: 'Home & hosting', short: 'Hosting' },
  home: { label: 'Home, not hosting', short: 'Home' },
  away: { label: 'Away', short: 'Away' },
};

// ───────────── utils ─────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(dt) { return dt.toISOString().slice(0, 10); },
  add(s, n) { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.fmt(d); },
  range(a, b) { const out = []; if (!a || !b) return out; for (let s = a; s <= b && out.length < 400; s = D.add(s, 1)) out.push(s); return out; },
  dow(s) { return D.parse(s).getUTCDay(); },
  weekend(s) { const w = D.dow(s); return w === 0 || w === 6; },
  label(s) { return D.parse(s).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }); },
  month(s) { return D.parse(s).toLocaleDateString('en-NZ', { month: 'short', year: 'numeric', timeZone: 'UTC' }); },
  short(s) { return D.parse(s).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); },
  today() { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; },
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function ageOn(kid, date) {
  if (!kid.birth_month) return null;
  const b = D.parse(kid.birth_month.slice(0, 7) + '-01'), d = D.parse(date);
  let a = d.getUTCFullYear() - b.getUTCFullYear();
  if (d.getUTCMonth() < b.getUTCMonth()) a--;
  return a;
}
function kidName(k, date) { const a = ageOn(k, date || D.today()); return esc(k.first_name) + (a != null ? ` (${a})` : ''); }
// Compress a sorted list of dates into runs (bridging weekends)
function runs(dates) {
  const out = []; let cur = null;
  for (const d of [...dates].sort()) {
    if (cur && d <= D.add(cur.end, 3)) cur.end = d, cur.dates.push(d);
    else { cur = { start: d, end: d, dates: [d] }; out.push(cur); }
  }
  return out;
}
const runLabel = r => r.start === r.end ? D.short(r.start) : `${D.short(r.start)} – ${D.short(r.end)}`;

// ───────────── Supabase backend ─────────────
function supaBackend(sb) {
  let user = null;
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    demo: false,
    async init() {
      const { data } = await sb.auth.getSession();
      user = data.session?.user || null;
      sb.auth.onAuthStateChange((_ev, s) => {
        const n = s?.user || null;
        if ((n?.id || null) !== (user?.id || null)) { user = n; boot(); }
      });
      return user;
    },
    async signIn(email) { ok(await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } })); },
    async verify(email, token) { const d = ok(await sb.auth.verifyOtp({ email, token, type: 'email' })); user = d.user; },
    async signOut() { await sb.auth.signOut(); user = null; },
    async getMe() {
      const fu = ok(await sb.from('family_users').select('family_id, families(id,name)').eq('user_id', user.id).maybeSingle());
      if (!fu) return { family: null, groups: [] };
      const code = ok(await sb.from('family_codes').select('join_code').eq('family_id', fu.family_id).maybeSingle());
      const gs = ok(await sb.from('group_families').select('role, groups(id,name,invite_code)').eq('family_id', fu.family_id));
      return { family: { ...fu.families, join_code: code?.join_code }, groups: gs.filter(r => r.groups).map(r => ({ ...r.groups, role: r.role })) };
    },
    async createFamily(name) { ok(await sb.rpc('create_family', { p_name: name })); },
    async joinFamily(code) { ok(await sb.rpc('join_family', { p_code: code })); },
    async updateFamily(id, name) { ok(await sb.from('families').update({ name }).eq('id', id)); },
    async createGroup(name) {
      const g = ok(await sb.rpc('create_group', { p_name: name }));
      await this.saveHolidays(g.id, DEFAULT_HOLIDAYS);
      return g;
    },
    async joinGroup(code) { return ok(await sb.rpc('join_group', { p_code: code })); },
    async leaveGroup(gid, fid) { ok(await sb.from('group_families').delete().eq('group_id', gid).eq('family_id', fid)); },
    async loadGroup(gid) {
      const holidays = ok(await sb.from('group_holidays').select('*').eq('group_id', gid).order('start_date'));
      const mem = ok(await sb.from('group_families').select('family_id, role, families(id,name)').eq('group_id', gid));
      const families = mem.filter(m => m.families).map(m => ({ ...m.families, role: m.role }));
      const fids = families.map(f => f.id);
      const kids = fids.length ? ok(await sb.from('kids').select('*').in('family_id', fids).order('created_at')) : [];
      const lo = holidays.reduce((a, h) => (!a || h.start_date < a ? h.start_date : a), null);
      const hi = holidays.reduce((a, h) => (!a || h.end_date > a ? h.end_date : a), null);
      let plans = [], progs = [];
      if (lo && fids.length) {
        plans = ok(await sb.from('day_plans').select('*').in('family_id', fids).gte('date', lo).lte('date', hi));
        const kidIds = kids.map(k => k.id);
        if (kidIds.length) progs = ok(await sb.from('kid_programmes').select('*').in('kid_id', kidIds).gte('date', lo).lte('date', hi));
      }
      return { holidays, families, kids, plans, progs };
    },
    async saveHolidays(gid, list) {
      ok(await sb.from('group_holidays').delete().eq('group_id', gid));
      if (list.length) ok(await sb.from('group_holidays').insert(list.map(h => ({ group_id: gid, name: h.name, start_date: h.start_date, end_date: h.end_date, note: h.note || null }))));
    },
    async saveKid(k) {
      const row = { family_id: k.family_id, first_name: k.first_name, birth_month: k.birth_month || null, gender: k.gender || null };
      if (k.id) ok(await sb.from('kids').update(row).eq('id', k.id));
      else ok(await sb.from('kids').insert(row));
    },
    async deleteKid(id) { ok(await sb.from('kids').delete().eq('id', id)); },
    async upsertPlans(rows) { ok(await sb.from('day_plans').upsert(rows.map(r => ({ ...r, updated_at: new Date().toISOString() })), { onConflict: 'family_id,date' })); },
    async deletePlan(fid, date) { ok(await sb.from('day_plans').delete().eq('family_id', fid).eq('date', date)); },
    async upsertProgs(rows) { ok(await sb.from('kid_programmes').upsert(rows, { onConflict: 'kid_id,date' })); },
    async deleteProgs(ids) { ok(await sb.from('kid_programmes').delete().in('id', ids)); },
  };
}

// ───────────── Demo backend (browser-only) ─────────────
function demoBackend() {
  const KEY = 'co-hortdinate-demo-v1';
  let db = store.get(KEY, null);
  const save = () => store.set(KEY, db);
  if (!db) {
    db = { families: [], groups: [], group_families: [], group_holidays: [], kids: [], day_plans: [], kid_programmes: [] };
    const fam = (id, name) => db.families.push({ id, name, join_code: id.toUpperCase() + 'CODE' });
    fam('f1', 'Our family'); fam('f2', 'Sharma whānau'); fam('f3', 'Wilsons'); fam('f4', 'Ngata family');
    db.groups.push({ id: 'g1', name: 'School mates (demo)', invite_code: 'DEMO2027' });
    ['f1', 'f2', 'f3', 'f4'].forEach((f, i) => db.group_families.push({ group_id: 'g1', family_id: f, role: i ? 'member' : 'admin' }));
    DEFAULT_HOLIDAYS.forEach(h => db.group_holidays.push({ id: uid(), group_id: 'g1', ...h }));
    const kid = (id, f, n, b, g) => db.kids.push({ id, family_id: f, first_name: n, birth_month: b, gender: g });
    kid('k1', 'f1', 'Anaya', '2018-03-01', 'girl'); kid('k2', 'f1', 'Arjun', '2021-06-01', 'boy');
    kid('k3', 'f2', 'Mia', '2018-09-01', 'girl'); kid('k4', 'f2', 'Leo', '2020-02-01', 'boy');
    kid('k5', 'f3', 'Ava', '2017-11-01', 'girl');
    kid('k6', 'f4', 'Tama', '2019-05-01', 'boy'); kid('k7', 'f4', 'Hine', '2016-08-01', 'girl');
    const plan = (f, from, to, status, capacity = 0, note = '') => D.range(from, to).filter(d => !D.weekend(d) && !PUBLIC_HOLIDAYS[d])
      .forEach(date => db.day_plans.push({ family_id: f, date, status, capacity, note }));
    plan('f2', '2027-01-05', '2027-02-02', 'need');
    plan('f2', '2027-01-25', '2027-01-29', 'host', 2, 'Beach most afternoons');
    plan('f3', '2026-12-21', '2027-01-08', 'away');
    plan('f3', '2027-01-11', '2027-01-15', 'host', 3, 'Till 4pm');
    plan('f3', '2027-01-18', '2027-02-02', 'need');
    plan('f4', '2027-01-11', '2027-02-02', 'need');
    plan('f4', '2027-01-20', '2027-01-22', 'host', 1);
    const prog = (k, from, to, p) => D.range(from, to).filter(d => !D.weekend(d)).forEach(date => db.kid_programmes.push({ id: uid(), kid_id: k, date, programme: p }));
    prog('k3', '2027-01-18', '2027-01-20', 'Kelly Club Mt Albert'); prog('k5', '2027-01-18', '2027-01-21', 'Kelly Club Mt Albert');
    prog('k6', '2027-01-12', '2027-01-14', 'Auckland Zoo holiday programme'); prog('k7', '2027-01-12', '2027-01-14', 'Auckland Zoo holiday programme');
    save();
  }
  const ME = 'f1';
  return {
    demo: true,
    async init() { return { id: 'demo', email: 'demo' }; },
    async signOut() { try { localStorage.removeItem(KEY); } catch {} location.reload(); },
    async getMe() {
      const f = db.families.find(f => f.id === ME);
      const groups = db.group_families.filter(gf => gf.family_id === ME).map(gf => ({ ...db.groups.find(g => g.id === gf.group_id), role: gf.role }));
      return { family: f, groups };
    },
    async updateFamily(id, name) { db.families.find(f => f.id === id).name = name; save(); },
    async createGroup(name) {
      const g = { id: uid(), name, invite_code: Math.random().toString(36).slice(2, 10).toUpperCase() };
      db.groups.push(g); db.group_families.push({ group_id: g.id, family_id: ME, role: 'admin' });
      DEFAULT_HOLIDAYS.forEach(h => db.group_holidays.push({ id: uid(), group_id: g.id, ...h }));
      save(); return g;
    },
    async joinGroup(code) {
      const g = db.groups.find(g => g.invite_code === code.trim().toUpperCase());
      if (!g) throw new Error('That invite code was not found');
      if (!db.group_families.some(x => x.group_id === g.id && x.family_id === ME)) db.group_families.push({ group_id: g.id, family_id: ME, role: 'member' });
      save(); return g;
    },
    async leaveGroup(gid, fid) { db.group_families = db.group_families.filter(x => !(x.group_id === gid && x.family_id === fid)); save(); },
    async loadGroup(gid) {
      const mem = db.group_families.filter(x => x.group_id === gid);
      const families = mem.map(m => ({ ...db.families.find(f => f.id === m.family_id), role: m.role }));
      const fids = new Set(families.map(f => f.id));
      const kids = db.kids.filter(k => fids.has(k.family_id));
      const kidIds = new Set(kids.map(k => k.id));
      return {
        holidays: db.group_holidays.filter(h => h.group_id === gid).sort((a, b) => a.start_date.localeCompare(b.start_date)),
        families, kids,
        plans: db.day_plans.filter(p => fids.has(p.family_id)),
        progs: db.kid_programmes.filter(p => kidIds.has(p.kid_id)),
      };
    },
    async saveHolidays(gid, list) { db.group_holidays = db.group_holidays.filter(h => h.group_id !== gid).concat(list.map(h => ({ ...h, id: uid(), group_id: gid }))); save(); },
    async saveKid(k) {
      if (k.id) Object.assign(db.kids.find(x => x.id === k.id), k);
      else db.kids.push({ ...k, id: uid() });
      save();
    },
    async deleteKid(id) { db.kids = db.kids.filter(k => k.id !== id); db.kid_programmes = db.kid_programmes.filter(p => p.kid_id !== id); save(); },
    async upsertPlans(rows) {
      for (const r of rows) { db.day_plans = db.day_plans.filter(p => !(p.family_id === r.family_id && p.date === r.date)); db.day_plans.push(r); }
      save();
    },
    async deletePlan(fid, date) { db.day_plans = db.day_plans.filter(p => !(p.family_id === fid && p.date === date)); save(); },
    async upsertProgs(rows) {
      for (const r of rows) { db.kid_programmes = db.kid_programmes.filter(p => !(p.kid_id === r.kid_id && p.date === r.date)); db.kid_programmes.push({ id: uid(), ...r }); }
      save();
    },
    async deleteProgs(ids) { const s = new Set(ids); db.kid_programmes = db.kid_programmes.filter(p => !s.has(p.id)); save(); },
  };
}

// ───────────── State ─────────────
let API;
const S = {
  user: null, family: null, groups: [], groupId: store.get('hh-group', null), g: null,
  periodId: null, tab: store.get('hh-tab', 'cal'), showWeekends: store.get('hh-weekends', false),
  openDay: null, editKid: null, prefill: null, sentTo: null, error: '', busy: false,
};
const $app = document.getElementById('app'), $hdr = document.getElementById('hdr'), $nav = document.getElementById('nav');

function indexGroup(raw) {
  const g = { ...raw, planMap: {}, progMap: {}, famById: {} };
  raw.families.forEach(f => g.famById[f.id] = f);
  raw.plans.forEach(p => g.planMap[p.family_id + '|' + p.date] = p);
  raw.progs.forEach(p => g.progMap[p.kid_id + '|' + p.date] = p);
  return g;
}
async function reloadGroup() {
  if (!S.groupId) { S.g = null; return; }
  S.g = indexGroup(await API.loadGroup(S.groupId));
  const today = D.today();
  if (!S.g.holidays.some(h => h.id === S.periodId)) {
    const next = S.g.holidays.find(h => h.end_date >= today) || S.g.holidays[S.g.holidays.length - 1];
    S.periodId = next?.id || null;
  }
}
async function boot() {
  try {
    S.error = '';
    if (!API) {
      if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        API = supaBackend(createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY));
      } else API = demoBackend();
      S.user = await API.init();
    }
    if (S.user) {
      const me = await API.getMe();
      S.family = me.family; S.groups = me.groups;
      if (!S.groups.some(g => g.id === S.groupId)) S.groupId = S.groups[0]?.id || null;
      await reloadGroup();
    }
  } catch (e) { S.error = e.message || String(e); }
  render();
}

// ───────────── Derived data ─────────────
const period = () => S.g?.holidays.find(h => h.id === S.periodId);
function periodDays(all) {
  const p = period(); if (!p) return [];
  return D.range(p.start_date, p.end_date).filter(d => all || S.showWeekends || !D.weekend(d));
}
const myKids = () => S.g ? S.g.kids.filter(k => k.family_id === S.family.id) : [];
function daySummary(date) {
  const g = S.g, need = [], hosts = [], home = [], away = [], unset = [], progs = [];
  for (const f of g.families) {
    const fk = g.kids.filter(k => k.family_id === f.id);
    const p = g.planMap[f.id + '|' + date];
    if (!p) { if (fk.length) unset.push(f); continue; }
    if (p.status === 'need') { for (const k of fk) if (!g.progMap[k.id + '|' + date]) need.push({ k, f }); }
    else if (p.status === 'host') hosts.push({ f, p });
    else if (p.status === 'home') home.push(f);
    else away.push(f);
  }
  for (const k of g.kids) { const pr = g.progMap[k.id + '|' + date]; if (pr) progs.push({ k, f: g.famById[k.family_id], pr }); }
  const spots = hosts.reduce((a, h) => a + (h.p.capacity || 0), 0);
  return { need, hosts, home, away, unset, progs, spots, short: Math.max(0, need.length - spots) };
}

// ───────────── Rendering ─────────────

  const p = period();
  if (!S.user) { $nav.hidden = true; $hdr.innerHTML = '<h1>Co-hortdinate</h1>'; $app.innerHTML = errBox() + viewLogin(); return; }
  if (!S.family) { $nav.hidden = true; $hdr.innerHTML = '<h1>Co-hortdinate</h1>'; $app.innerHTML = errBox() + viewOnboardFamily(); return; }
  if (!S.groupId || !S.g) { $nav.hidden = true; $hdr.innerHTML = '<h1>Co-hortdinate</h1>'; $app.innerHTML = errBox() + viewOnboardGroup(); return; }

  $hdr.innerHTML = `<h1>Co-hortdinate</h1>
    <div class="row">
      ${S.groups.length > 1 ? `<select data-c="group">${S.groups.map(g => `<option value="${g.id}" ${g.id === S.groupId ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>` : ''}
      <select data-c="period">${S.g.holidays.map(h => `<option value="${h.id}" ${h.id === S.periodId ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select>
    </div>`;
  const tabs = [['cal', '📅', 'Calendar'], ['plan', '✏️', 'My plan'], ['progs', '🎨', 'Programmes'], ['family', '👨‍👩‍👧', 'Family'], ['group', '👥', 'Group']];
  $nav.hidden = false;
  $nav.innerHTML = tabs.map(([k, i, l]) => `<button data-a="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}"><span>${i}</span>${l}</button>`).join('');
  const banner = API.demo ? `<div class="banner"><b>Demo mode</b> — sample friends, saved in this browser only. Add your Supabase keys to go live.</div>` : '';
  const views = { cal: viewCalendar, plan: viewPlan, progs: viewProgrammes, family: viewFamily, group: viewGroup };
  $app.innerHTML = banner + errBox() + (p || S.tab === 'group' || S.tab === 'family' ? views[S.tab]() : `<div class="card">No holiday periods set up yet. ${isAdmin() ? 'Add them under Group.' : 'Ask your group admin to add them.'}</div>`);
  if (S.prefill && S.tab === 'plan') applyPrefill();
}
const errBox = () => S.error ? `<div class="err">${esc(S.error)}</div>` : '';
const isAdmin = () => S.groups.find(g => g.id === S.groupId)?.role === 'admin';
const weekendToggle = () => `<label class="toggle"><input type="checkbox" data-c="weekends" ${S.showWeekends ? 'checked' : ''}> Show weekends</label>`;

function viewCalendar() {
  const p = period(), days = periodDays();
  const sums = days.map(d => [d, daySummary(d)]);
  const shortDays = sums.filter(([, s]) => s.short > 0).length;
  const okDays = sums.filter(([, s]) => s.need.length && !s.short).length;
  const filled = S.g.families.filter(f => S.g.kids.some(k => k.family_id === f.id) && days.some(d => S.g.planMap[f.id + '|' + d])).length;
  const withKids = S.g.families.filter(f => S.g.kids.some(k => k.family_id === f.id)).length;
  // Spare spots: hosting offers on days where offered spots exceed need
  const offers = {};
  for (const [d, sm] of sums) {
    const free = sm.spots - sm.need.length;
    if (free <= 0) continue;
    const hostNames = sm.hosts.map(h => h.f.name).sort().join(', ');
    const notes = sm.hosts.filter(h => h.p.note).map(h => h.p.note).join('; ');
    const mine = sm.hosts.some(h => h.f.id === S.family.id);
    const key = free + '|' + hostNames + '|' + notes;
    (offers[key] ||= { free, hostNames, notes, mine, dates: [] }).dates.push(d);
  }
  const offerRows = Object.values(offers).flatMap(o => runs(o.dates).map(r => ({ ...o, r })))
    .sort((a, b) => a.r.start.localeCompare(b.r.start));
  const spareDays = sums.filter(([, sm]) => sm.spots > sm.need.length).length;
  const spareCard = offerRows.length ? `<div class="card spare">
      <div class="flex"><h2 class="grow" style="margin:0">Spare spots</h2><span class="pill spare">${spareDays} day${spareDays > 1 ? 's' : ''}</span></div>
      <p class="muted">Still planning your leave? These days already have friends home with room for more kids.</p>
      ${(S.showAllOffers ? offerRows : offerRows.slice(0, 4)).map(o => `<div class="kidrow"><div class="grow"><b>${runLabel(o.r)}</b><div><span class="pill spare">${o.free} spot${o.free > 1 ? 's' : ''} free</span> <span class="muted">with ${esc(o.hostNames)}${o.notes ? ' · ' + esc(o.notes) : ''}</span></div></div>${o.mine ? '<span class="pill ph">incl. you</span>' : ''}</div>`).join('')}
      ${offerRows.length > 4 ? `<button class="link" data-a="toggleOffers">${S.showAllOffers ? 'Show fewer' : `Show all ${offerRows.length}`}</button>` : ''}
    </div>` : '';
  let html = `<div class="summary"><div><b style="color:var(--need)">${shortDays}</b><span class="muted">days short</span></div>
    <div><b style="color:var(--host)">${okDays}</b><span class="muted">days covered</span></div>
    <div><b>${filled}/${withKids}</b><span class="muted">families filled in</span></div></div>
    ${p.note ? `<p class="muted" style="margin:-4px 0 10px">${esc(p.note)}</p>` : ''}
    ${spareCard}
    <div class="legend"><span class="pill need">● need care</span><span class="pill host">● spare spots</span><span class="pill prog">● at programmes</span><span class="pill ph">−2 short · ✓ covered · +2 spare</span></div>
    ${weekendToggle()}`;
  // Week-by-week grid: one row per week, Mon–Fri (or Mon–Sun), tap a day for detail
  const sumMap = Object.fromEntries(sums);
  const cols = S.showWeekends ? 7 : 5;
  let wk = D.add(p.start_date, -((D.dow(p.start_date) + 6) % 7)); // Monday on/before start
  html += `<div class="wkhead" style="grid-template-columns:${cols === 7 ? 40 : 56}px repeat(${cols},minmax(0,1fr))"><span></span>${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].slice(0, cols).map(x => `<span>${x}</span>`).join('')}</div>`;
  let first = true;
  while (wk <= p.end_date) {
    const wdays = Array.from({ length: cols }, (_, i) => D.add(wk, i));
    const inP = wdays.filter(d => d >= p.start_date && d <= p.end_date);
    if (!inP.some(d => sumMap[d])) { wk = D.add(wk, 7); continue; }
    const wShort = inP.filter(d => sumMap[d]?.short).length;
    html += `<div class="week" style="grid-template-columns:${cols === 7 ? 40 : 56}px repeat(${cols},minmax(0,1fr))">
      <div class="wklabel">${D.parse(wk).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', timeZone: 'UTC' })}${wShort ? `<small class="pill need">${wShort} short</small>` : ''}</div>`;
    for (const d of wdays) {
      const s = sumMap[d];
      if (d < p.start_date || d > p.end_date || !s) { html += '<div class="cell out"></div>'; continue; }
      const ph = PUBLIC_HOLIDAYS[d];
      const spare = s.spots - s.need.length;
      const cls = s.short ? 'short' : s.need.length ? 'ok' : spare > 0 ? 'spare' : ph ? 'ph' : 'quiet';
      const num = D.parse(d).getUTCDate();
      const mon = first || num === 1 ? `<small>${D.parse(d).toLocaleDateString('en-NZ', { month: 'short', timeZone: 'UTC' })}</small>` : '';
      first = false;
      html += `<button class="cell ${cls} ${S.openDay === d ? 'sel' : ''}" data-a="openDay" data-v="${d}" title="${esc(ph || '')}">
        <span class="n">${num}${mon}</span>
        <span class="big">${s.short ? '−' + s.short : s.need.length ? '✓' : spare > 0 ? '+' + spare : ph ? 'PH' : ''}</span>
        <span class="mini">${s.need.length ? `<i class="dn">${s.need.length}</i>` : ''}${s.spots ? `<i class="ds">${s.spots}</i>` : ''}${s.progs.length ? `<i class="dp">${s.progs.length}</i>` : ''}</span>
      </button>`;
    }
    html += '</div>';
    if (S.openDay && wdays.includes(S.openDay) && sumMap[S.openDay]) html += dayDetail(S.openDay, sumMap[S.openDay]);
    wk = D.add(wk, 7);
  }
  return html;
}
function dayDetail(d, s) {
  const fam = f => esc(f.name);
  const byProg = {};
  s.progs.forEach(x => (byProg[x.pr.programme] ||= []).push(x));
  const ph = PUBLIC_HOLIDAYS[d];
  return `<div class="detail panel">
    <div class="flex"><b class="grow">${D.parse(d).toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })}${ph ? ` <span class="pill ph">${esc(ph)}</span>` : ''}</b><button class="link" data-a="openDay" data-v="${d}">Close</button></div>
    <div class="chips" style="margin-top:4px">${s.short ? `<span class="pill need">${s.short} kid${s.short > 1 ? 's' : ''} without a spot</span>` : (s.need.length ? '<span class="pill host">Everyone covered</span>' : '') + (s.spots > s.need.length ? `<span class="pill spare">${s.spots - s.need.length} spare spot${s.spots - s.need.length > 1 ? 's' : ''}</span>` : '') || '<span class="muted">No one needs care (yet)</span>'}</div>
    ${s.need.length ? `<h4>Need care (${s.need.length})</h4><div class="chips">${s.need.map(x => `<span class="chip">${kidName(x.k, d)} <small>· ${fam(x.f)}</small></span>`).join('')}</div>` : ''}
    ${s.hosts.length ? `<h4>Hosting</h4><div class="chips">${s.hosts.map(h => `<span class="chip"><b>${fam(h.f)}</b> — ${h.p.capacity} spot${h.p.capacity === 1 ? '' : 's'}${h.p.note ? ` <small>· ${esc(h.p.note)}</small>` : ''}</span>`).join('')}</div>` : ''}
    ${Object.keys(byProg).length ? `<h4>At programmes</h4>${Object.entries(byProg).map(([p, xs]) => `<div style="margin-bottom:4px"><span class="pill prog">${esc(p)}</span> ${xs.map(x => `<span class="chip">${kidName(x.k, d)} <small>· ${fam(x.f)}</small></span>`).join(' ')}</div>`).join('')}` : ''}
    ${s.home.length ? `<h4>Home, not hosting</h4><div class="chips">${s.home.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
    ${s.away.length ? `<h4>Away</h4><div class="chips">${s.away.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
    ${s.unset.length ? `<h4 class="muted">Not filled in yet</h4><div class="chips">${s.unset.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
  </div>`;
}

  const p = period(), days = periodDays(), fid = S.family.id;
  const names = [...new Set(S.g.progs.map(x => x.programme))].sort();
  // my bookings in this period
  const mine = S.g.progs.filter(x => kids.some(k => k.id === x.kid_id) && x.date >= p.start_date && x.date <= p.end_date);
  const groups = {};
  mine.forEach(x => (groups[x.kid_id + '|' + x.programme] ||= []).push(x));
  const bookingRows = Object.entries(groups).flatMap(([key, xs]) => {
    const [kidId, prog] = [key.slice(0, key.indexOf('|')), key.slice(key.indexOf('|') + 1)];

      <label>Which kids</label><div class="flex" style="flex-wrap:wrap">${kids.map(k => `<label class="toggle" style="margin:0 10px 0 0"><input type="checkbox" name="kid" value="${k.id}" checked> ${esc(k.first_name)}</label>`).join('')}</div>
      <label>Programme or arrangement</label><input name="programme" list="progNames" required maxlength="80" placeholder="e.g. Kelly Club Mt Albert">
      <datalist id="progNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="grid2"><div><label>From</label><input type="date" name="from" required min="${p.start_date}" max="${p.end_date}"></div>
      <div><label>To</label><input type="date" name="to" required min="${p.start_date}" max="${p.end_date}"></div></div>
      <label class="toggle" style="margin-top:8px"><input type="checkbox" name="weekdays" checked> Weekdays only, skip public holidays</label>
      <button>Add booking</button>
    </form>
    ${bookingRows.length ? `<h3>Booked this holiday</h3>${bookingRows.join('')}` : ''}
  </div>
  <h3 class="muted" style="margin:14px 2px 6px">Day by day</h3>
  ${weekendToggle()}`;
  for (const d of days) {
    const pl = S.g.planMap[fid + '|' + d];
    const ph = PUBLIC_HOLIDAYS[d];
    const kp = kids.map(k => [k, S.g.progMap[k.id + '|' + d]]).filter(([, x]) => x);
    html += `<div class="plan"><div class="top">
      <div class="d">${D.short(d).replace(/ \w+$/, '')}<div class="muted" style="font-weight:400;font-size:11px">${ph ? esc(ph) : D.parse(d).toLocaleDateString('en-NZ', { month: 'short', timeZone: 'UTC' })}</div></div>
      <div class="seg grow">${Object.entries(STATUS).map(([k, v]) => `<button class="${k} ${pl?.status === k ? 'on' : ''}" data-a="setStatus" data-d="${d}" data-v="${k}">${v.short}</button>`).join('')}
      ${pl ? `<button class="x" data-a="clearStatus" data-d="${d}" title="Clear">✕</button>` : ''}</div>
    </div>
    ${pl?.status === 'host' ? `<div class="hostrow"><span class="muted">Extra kids:</span><div class="stepper"><button data-a="cap" data-d="${d}" data-v="-1">−</button><b>${pl.capacity}</b><button data-a="cap" data-d="${d}" data-v="1">+</button></div>
      <input class="grow" data-c="note" data-d="${d}" value="${esc(pl.note || '')}" maxlength="140" placeholder="Note, e.g. till 3pm, beach trip"></div>` : ''}
    ${kp.length ? `<div class="chips" style="margin-top:6px">${kp.map(([k, x]) => `<span class="pill prog">${esc(k.first_name)} @ ${esc(x.programme)}</span>`).join('')}</div>` : ''}
    </div>`;
  }
  return html;
}
function applyPrefill() {
  const f = document.getElementById('progForm'); if (!f) return;
  f.programme.value = S.prefill.programme; f.from.value = S.prefill.from; f.to.value = S.prefill.to;
  f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  S.prefill = null;
}

function viewProgrammes() {
  const p = period();
  const list = S.g.progs.filter(x => x.date >= p.start_date && x.date <= p.end_date);
  if (!list.length) return `<div class="card"><h2>Programmes</h2><p>No one has added a holiday programme for ${esc(p.name)} yet.</p><p class="muted">Add your kids' bookings in My plan — friends can then book the same programme on the same days.</p><button data-a="tab" data-v="plan">Add a booking</button></div>`;
  const byProg = {};
  list.forEach(x => { const key = x.programme.trim().toLowerCase(); (byProg[key] ||= { name: x.programme, rows: [] }).rows.push(x); });
  const kidById = Object.fromEntries(S.g.kids.map(k => [k.id, k]));
  return `<p class="muted" style="margin:0 2px 10px">Who's going where in ${esc(p.name)}. Programmes fill up fast — book early if you want your kids together.</p>` +
    Object.values(byProg).sort((a, b) => b.rows.length - a.rows.length).map(pg => {
      const dates = [...new Set(pg.rows.map(r => r.date))].sort();
      const kidsIn = new Set(pg.rows.map(r => r.kid_id));
      return `<div class="card prog"><div class="flex"><h2 class="grow" style="margin:0">${esc(pg.name)}</h2><span class="pill prog">${kidsIn.size} kid${kidsIn.size > 1 ? 's' : ''}</span></div>
        ${dates.map(d => `<div class="kidrow"><div style="width:110px;font-weight:600;font-size:14px">${D.short(d)}</div><div class="chips grow">${pg.rows.filter(r => r.date === d).map(r => { const k = kidById[r.kid_id]; return k ? `<span class="chip">${kidName(k, d)} <small>· ${esc(S.g.famById[k.family_id]?.name)}</small></span>` : ''; }).join('')}</div></div>`).join('')}
        <div style="margin-top:8px"><button class="ghost" data-a="bookSame" data-v="${esc(pg.name)}" data-from="${dates[0]}" data-to="${dates[dates.length - 1]}">Book my kids for these days</button></div>
      </div>`;
    }).join('');
}

function viewFamily() {
  const kids = S.g ? myKids() : [];
  const ek = S.editKid ? kids.find(k => k.id === S.editKid) : null;
  return `<div class="card"><h2>Your family</h2>
    <form data-f="renameFamily"><label>Family name (shown to your groups)</label><div class="flex"><input class="grow" name="name" required maxlength="60" value="${esc(S.family.name)}"><button>Save</button></div></form>
    ${S.family.join_code ? `<label>Partner code</label><span class="code">${esc(S.family.join_code)}</span>
    <p class="muted">Your partner signs in with their own email and enters this code to share your family's plan. Don't share it outside your household.</p>` : ''}
  </div>
  <div class="card"><h2>Kids</h2>
    ${kids.map(k => `<div class="kidrow"><div class="grow"><b>${kidName(k)}</b> <span class="muted">${k.gender ? ({ girl: 'girl', boy: 'boy', other: '' }[k.gender] || '') : ''}</span></div>
      <button class="link" data-a="editKid" data-v="${k.id}">Edit</button><button class="danger" data-a="delKid" data-v="${k.id}">Remove</button></div>`).join('') || '<p class="muted">No kids added yet.</p>'}
    <h3>${ek ? 'Edit ' + esc(ek.first_name) : 'Add a kid'}</h3>
    <form data-f="saveKid">
      <input type="hidden" name="id" value="${ek?.id || ''}">
      <label>First name</label><input name="first_name" required maxlength="40" value="${esc(ek?.first_name || '')}">
      <div class="grid2"><div><label>Birth month (for age)</label><input type="month" name="birth_month" value="${ek?.birth_month ? ek.birth_month.slice(0, 7) : ''}"></div>
      <div><label>Gender (optional)</label><select name="gender"><option value="">—</option>${['girl', 'boy', 'other'].map(g => `<option value="${g}" ${ek?.gender === g ? 'selected' : ''}>${g[0].toUpperCase() + g.slice(1)}</option>`).join('')}</select></div></div>
      <div class="flex" style="margin-top:10px"><button>${ek ? 'Save' : 'Add'}</button>${ek ? '<button type="button" class="link" data-a="cancelKid">Cancel</button>' : ''}</div>
    </form>
    <p class="muted">First names only. Only families in your groups can see this.</p>
  </div>`;
}

function viewGroup() {
  const g = S.groups.find(x => x.id === S.groupId);
  const admin = isAdmin();
  const others = S.groups.filter(x => x.id !== S.groupId);
  return `<div class="card"><h2>${esc(g.name)}</h2>
    <label>Invite code</label><div class="flex"><span class="code">${esc(g.invite_code)}</span><button class="ghost" data-a="copyInvite">Copy invite</button></div>
    <p class="muted">Share only with families you trust — anyone with the code can join and see the group's kids and plans.</p>
    <h3>Families (${S.g.families.length})</h3>
    ${S.g.families.map(f => { const n = S.g.kids.filter(k => k.family_id === f.id).length; return `<div class="kidrow"><div class="grow"><b>${esc(f.name)}</b>${f.id === S.family.id ? ' <span class="muted">(you)</span>' : ''}<div class="muted">${n} kid${n === 1 ? '' : 's'}</div></div>${f.role === 'admin' ? '<span class="pill ph">admin</span>' : ''}</div>`; }).join('')}
  </div>
  <div class="card"><h2>Holiday dates</h2>
    ${admin ? `<p class="muted">Official NZ dates are pre-filled. Term 1 start and Term 4 finish vary by school — adjust the summer dates to match your kids' school.</p>
      <form data-f="saveHolidays">
        ${S.g.holidays.map((h, i) => holRow(h, i)).join('')}
        <div id="newHol"></div>
        <div class="flex" style="margin-top:8px;flex-wrap:wrap"><button type="button" class="ghost" data-a="addHol">+ Add period</button><button>Save dates</button><button type="button" class="link" data-a="resetHols">Reset to NZ defaults</button></div>
      </form>`
    : S.g.holidays.map(h => `<div class="kidrow"><div class="grow"><b>${esc(h.name)}</b><div class="muted">${D.short(h.start_date)} – ${D.short(h.end_date)}</div></div></div>`).join('') + '<p class="muted">Only the group admin can change these.</p>'}
  </div>
  <div class="card"><h2>Other groups</h2>
    ${others.map(o => `<div class="kidrow"><div class="grow">${esc(o.name)}</div><button class="link" data-a="switchGroup" data-v="${o.id}">Open</button></div>`).join('')}
    <form data-f="joinGroup"><label>Join with invite code</label><div class="flex"><input class="grow" name="code" required><button>Join</button></div></form>
    <form data-f="createGroup"><label>Start a new group</label><div class="flex"><input class="grow" name="name" required maxlength="60"><button>Create</button></div></form>
  </div>
  <div class="card"><div class="flex" style="flex-wrap:wrap"><button class="danger" data-a="leaveGroup">Leave ${esc(g.name)}</button><span class="grow"></span>${API.demo ? '<button class="link" data-a="signOut">Reset demo data</button>' : '<button class="link" data-a="signOut">Sign out</button>'}</div></div>`;
}
const holRow = (h, i) => `<div class="holrow" data-hol>
  <input name="hname" value="${esc(h.name)}" required placeholder="Name"><input type="date" name="hstart" value="${h.start_date}" required><input type="date" name="hend" value="${h.end_date}" required>
  <button type="button" class="danger" data-a="rmHol">✕</button><input type="hidden" name="hnote" value="${esc(h.note || '')}"></div>`;

// ───────────── Actions ─────────────
async function run(fn, reload = true) {
  S.error = '';
  try { await fn(); if (reload) await reloadGroup(); }
  catch (e) { S.error = e.message || String(e); }
  render();
}
function setPlanLocal(row) { S.g.planMap[row.family_id + '|' + row.date] = row; }

const actions = {
  tab(el) { S.tab = el.dataset.v; store.set('hh-tab', S.tab); S.openDay = null; render(); scrollTo(0, 0); },
  toggleOffers() { S.showAllOffers = !S.showAllOffers; render(); },
  openDay(el) { S.openDay = S.openDay === el.dataset.v ? null : el.dataset.v; render(); },
  setStatus(el) {
    const d = el.dataset.d, prev = S.g.planMap[S.family.id + '|' + d];
    const row = { family_id: S.family.id, date: d, status: el.dataset.v, capacity: el.dataset.v === 'host' ? (prev?.capacity || 1) : 0, note: el.dataset.v === 'host' ? (prev?.note || '') : '' };
    setPlanLocal(row); render();
    run(() => API.upsertPlans([row]), false);
  },
  clearStatus(el) { const d = el.dataset.d; delete S.g.planMap[S.family.id + '|' + d]; render(); run(() => API.deletePlan(S.family.id, d), false); },
  cap(el) {
    const row = { ...S.g.planMap[S.family.id + '|' + el.dataset.d] };
    row.capacity = Math.max(0, Math.min(20, (row.capacity || 0) + Number(el.dataset.v)));
    setPlanLocal(row); render(); run(() => API.upsertPlans([row]), false);
  },
  bulkFill() {
    const status = document.getElementById('bulkStatus').value;
    const rows = periodDays(true).filter(d => !D.weekend(d) && !PUBLIC_HOLIDAYS[d] && !S.g.planMap[S.family.id + '|' + d])
      .map(d => ({ family_id: S.family.id, date: d, status, capacity: status === 'host' ? 1 : 0, note: '' }));
    if (!rows.length) { S.error = 'No empty weekdays left to fill.'; render(); return; }
    rows.forEach(setPlanLocal);
    run(() => API.upsertPlans(rows));
  },
  delProgs(el) { run(() => API.deleteProgs(el.dataset.v.split(','))); },
  bookSame(el) { S.prefill = { programme: el.dataset.v, from: el.dataset.from, to: el.dataset.to }; S.tab = 'plan'; render(); },
  editKid(el) { S.editKid = el.dataset.v; render(); },
  cancelKid() { S.editKid = null; render(); },
  delKid(el) { const k = myKids().find(k => k.id === el.dataset.v); if (confirm(`Remove ${k.first_name}? Their programme bookings will be removed too.`)) run(() => API.deleteKid(el.dataset.v)); },
  async copyInvite() {
    const g = S.groups.find(x => x.id === S.groupId);
    const text = `Join our school holiday group "${g.name}" on Co-hortdinate: ${location.origin + location.pathname}\nInvite code: ${g.invite_code}`;
    try { await navigator.clipboard.writeText(text); S.error = ''; alertInline('Invite copied — paste it into your group chat.'); }
    catch { prompt('Copy this invite:', text); }
  },
  switchGroup(el) { S.groupId = el.dataset.v; store.set('hh-group', S.groupId); S.periodId = null; S.tab = 'cal'; run(() => Promise.resolve()); },
  addHol() { document.getElementById('newHol').insertAdjacentHTML('beforeend', holRow({ name: '', start_date: '', end_date: '' })); },
  rmHol(el) { el.closest('[data-hol]').remove(); },
  resetHols() { if (confirm('Replace this group\'s holiday dates with the official NZ defaults?')) run(() => API.saveHolidays(S.groupId, DEFAULT_HOLIDAYS)); },
  leaveGroup() {
    if (!confirm('Leave this group? Your plan stays saved, but this group will no longer see it.')) return;
    run(async () => { await API.leaveGroup(S.groupId, S.family.id); S.groupId = null; const me = await API.getMe(); S.groups = me.groups; S.groupId = S.groups[0]?.id || null; });
  },
  signOut() { run(async () => { await API.signOut(); Object.assign(S, { user: null, family: null, groups: [], g: null, sentTo: null }); }, false); },
};
function alertInline(msg) {
  const el = document.createElement('div'); el.className = 'banner'; el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:84px;z-index:9;text-align:center';
  el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}

const forms = {
  async signin(f) {
    const email = f.email.value.trim(); S.busy = true; render();
    await run(async () => { await API.signIn(email); S.sentTo = email; }, false); S.busy = false; render();
  },
  async verify(f) { await run(async () => { await API.verify(S.sentTo, f.code.value.trim()); S.user = true; }, false); boot(); },
  async createFamily(f) { await run(() => API.createFamily(f.name.value.trim()), false); boot(); },
  async joinFamily(f) { await run(() => API.joinFamily(f.code.value.trim()), false); boot(); },
  async createGroup(f) { await run(async () => { const g = await API.createGroup(f.name.value.trim()); S.groupId = g.id; store.set('hh-group', g.id); S.tab = 'family'; }, false); boot(); },
  async joinGroup(f) { await run(async () => { const g = await API.joinGroup(f.code.value.trim()); S.groupId = g.id; store.set('hh-group', g.id); S.tab = myKids().length ? 'plan' : 'family'; }, false); boot(); },
  renameFamily(f) { const name = f.name.value.trim(); run(async () => { await API.updateFamily(S.family.id, name); S.family.name = name; }); },
  saveKid(f) {
    const k = { id: f.id.value || undefined, family_id: S.family.id, first_name: f.first_name.value.trim(), birth_month: f.birth_month.value ? f.birth_month.value + '-01' : null, gender: f.gender.value || null };
    S.editKid = null; run(() => API.saveKid(k));
  },
  addProg(f) {
    const kidIds = [...f.querySelectorAll('input[name=kid]:checked')].map(i => i.value);
    const from = f.from.value, to = f.to.value, programme = f.programme.value.trim();
    if (!kidIds.length) { S.error = 'Pick at least one kid.'; render(); return; }
    if (to < from) { S.error = '"To" date is before "From".'; render(); return; }
    const dates = D.range(from, to).filter(d => !f.weekdays.checked || (!D.weekend(d) && !PUBLIC_HOLIDAYS[d]));
    const rows = kidIds.flatMap(kid_id => dates.map(date => ({ kid_id, date, programme })));
    run(() => API.upsertProgs(rows));
  },
  saveHolidays(f) {
    const list = [...f.querySelectorAll('[data-hol]')].map(r => ({ name: r.querySelector('[name=hname]').value.trim(), start_date: r.querySelector('[name=hstart]').value, end_date: r.querySelector('[name=hend]').value, note: r.querySelector('[name=hnote]').value }));
    if (list.some(h => h.end_date < h.start_date)) { S.error = 'A holiday period ends before it starts.'; render(); return; }
    run(() => API.saveHolidays(S.groupId, list));
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !actions[el.dataset.a]) return;
  e.preventDefault(); actions[el.dataset.a](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!forms[f.dataset.f]) return;
  e.preventDefault(); forms[f.dataset.f](f);
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.c; if (!c) return;
  if (c === 'period') { S.periodId = el.value; S.openDay = null; render(); scrollTo(0, 0); }
  if (c === 'group') { S.groupId = el.value; store.set('hh-group', S.groupId); S.periodId = null; run(() => Promise.resolve()); }
  if (c === 'weekends') { S.showWeekends = el.checked; store.set('hh-weekends', S.showWeekends); render(); }
  if (c === 'note') { const row = { ...S.g.planMap[S.family.id + '|' + el.dataset.d], note: el.value.slice(0, 140) }; setPlanLocal(row); run(() => API.upsertPlans([row]), false); }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
