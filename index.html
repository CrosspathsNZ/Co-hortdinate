<head>

<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;
  --brand:#0f766e;--brand-soft:#ccfbf1;
  --need:#dc2626;--need-soft:#fee2e2;--host:#16a34a;--host-soft:#dcfce7;
  --home:#2563eb;--home-soft:#dbeafe;--away:#7c3aed;--away-soft:#ede9fe;
  --prog:#d97706;--prog-soft:#fef3c7;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 14px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header .row{display:flex;gap:8px;margin-top:8px}
header select{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 8px;font:inherit}
header select option{color:#000}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
button{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.link{background:none;color:var(--brand);padding:4px 6px}
button.danger{background:none;color:var(--need);padding:4px 6px}
button:disabled{opacity:.5}
.flex{display:flex;gap:8px;align-items:center}
.flex>*{min-width:0}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:9px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
.banner{background:var(--prog-soft);border:1px solid #fcd34d;color:#78350f;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.err{background:var(--need-soft);color:#7f1d1d;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.summary{display:flex;gap:8px;margin-bottom:12px}
.summary div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-size:22px}
.day{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;margin-bottom:6px}
.day.short{border-left-color:var(--need)}
.day.ok{border-left-color:var(--host)}
.day.quiet{border-left-color:#d6d3d1}
.dayhead{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.dayhead .d{width:92px;font-weight:600}
.dayhead .d small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dayhead .s{flex:1;font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.need{background:var(--need-soft);color:var(--need)}
.pill.host{background:var(--host-soft);color:var(--host)}
.pill.home{background:var(--home-soft);color:var(--home)}
.pill.away{background:var(--away-soft);color:var(--away)}
.pill.prog{background:var(--prog-soft);color:#92400e}
.pill.ph{background:#f5f5f4;color:var(--muted);font-weight:500}
.detail{padding:4px 12px 12px;border-top:1px solid var(--line)}
.detail h4{margin:10px 0 4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#f5f5f4;border-radius:8px;padding:3px 8px;font-size:13px}
.chip small{color:var(--muted)}
.plan{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.plan .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan .d{width:64px;font-weight:600;font-size:14px}
.seg{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}
.seg button{background:#f5f5f4;color:var(--ink);padding:6px 8px;font-size:13px;border-radius:7px}
.seg button.x{background:none;color:var(--muted);padding:6px 4px}
.seg button.on.need{background:var(--need);color:#fff}
.seg button.on.host{background:var(--host);color:#fff}
.seg button.on.home{background:var(--home);color:#fff}
.seg button.on.away{background:var(--away);color:#fff}
.hostrow{display:flex;gap:8px;align-items:center;margin-top:7px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{padding:4px 11px;background:var(--host-soft);color:var(--host);font-weight:700}
.stepper b{min-width:18px;text-align:center}
.kidrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kidrow:last-child{border-bottom:0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:2px;background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:8px;display:inline-block}
.prog{border-left:4px solid var(--prog)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 10px}
.holrow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.holrow input{padding:7px;font-size:13px}
.center{text-align:center}
.spin{padding:40px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wkhead,.week{display:grid;gap:4px;margin-bottom:4px}
.wkhead span{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.wklabel{font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1.1}
.wklabel .pill{font-size:10px;padding:1px 5px;align-self:flex-start}
.cell{min-width:0;min-height:62px;overflow:hidden;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:4px 5px;display:flex;flex-direction:column;align-items:stretch;text-align:left;font-size:12px;gap:0;cursor:pointer}
.cell.out{background:transparent;border:1px dashed #e7e5e4;cursor:default}
.cell .n{font-weight:600;font-size:12px;display:flex;gap:3px;align-items:baseline}
.cell .n small{font-weight:500;color:var(--muted);font-size:10px}
.cell .big{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.cell .mini{display:flex;gap:3px;justify-content:center;min-height:14px}
.cell .mini i{font-style:normal;font-size:10px;font-weight:700;border-radius:5px;padding:0 4px}
.cell .mini .dn{background:var(--need-soft);color:var(--need)}
.cell .mini .ds{background:var(--host-soft);color:var(--host)}
.cell .mini .dp{background:var(--prog-soft);color:#92400e}
.cell.short{background:#fef2f2;border-color:#fca5a5}.cell.short .big{color:var(--need)}
.cell.ok{background:#f0fdf4;border-color:#86efac}.cell.ok .big{color:var(--host)}
.cell.spare{background:#eff6ff;border-color:#93c5fd}.cell.spare .big{color:var(--home)}
.pill.spare{background:var(--home-soft);color:var(--home)}
.card.spare{border-left:4px solid var(--home)}
.cell.ph{background:#f5f5f4}.cell.ph .big{color:var(--muted);font-size:12px}
.cell.sel{outline:3px solid var(--brand);outline-offset:1px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;padding:12px;border-top:3px solid var(--brand)}
@media (min-width:600px){.cell{min-height:72px}.cell .big{font-size:20px}}


/* ───────── Playful theme ───────── */
:root{
  --bg:#fff8ec;--card:#fff;--ink:#2b2350;--muted:#7a7396;--line:#efe7da;
  --brand:#6c4cf1;--brand-dark:#5233d6;--brand-soft:#ede8ff;
  --need:#ff5a5f;--need-soft:#ffe4e4;--host:#1fbf75;--host-soft:#d9f7e8;
  --home:#2f8cff;--home-soft:#dcecff;--away:#b14cf1;--away-soft:#f4e3ff;
  --prog:#ffb020;--prog-soft:#fff1cc;--sun:#ffd23f;--pink:#ff7eb6;
}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12px 12px,rgba(108,76,241,.07) 3px,transparent 3.5px),radial-gradient(circle at 36px 30px,rgba(255,176,32,.09) 3px,transparent 3.5px);
  background-size:48px 48px}
h1,h2,.summary b,.cell .big,.code{font-family:"Baloo 2",Nunito,system-ui,sans-serif}
header{background:linear-gradient(120deg,#6c4cf1 0%,#9b5cf6 55%,#ff7eb6 100%);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(108,76,241,.25);padding-bottom:14px}
header h1{font-size:24px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:30px;height:30px;border-radius:9px;background:#fff url(icon.svg) center/26px no-repeat;box-shadow:0 2px 0 rgba(0,0,0,.12)}
header select{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);border-radius:12px;font-weight:700}
.card{border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.card h2{font-size:20px;font-weight:800;color:var(--ink)}
.card h3{color:var(--brand)}
input,select,textarea{border:2px solid var(--line);border-radius:12px;font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
button{border-radius:14px;font-weight:800;background:var(--brand);box-shadow:0 3px 0 var(--brand-dark);transition:transform .05s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-dark)}
button.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:0 3px 0 var(--brand-soft)}
button.link,button.danger,.seg button.x{box-shadow:none}
nav{border-top:0;box-shadow:0 -4px 16px rgba(43,35,80,.08);border-radius:20px 20px 0 0}
nav button{box-shadow:none;font-weight:700}
nav button span{font-size:22px;transition:transform .15s}
nav button.on{color:var(--brand)}
nav button.on span{transform:translateY(-2px) scale(1.15)}
nav button.on::after{content:"";width:22px;height:4px;border-radius:4px;background:var(--brand);margin-top:1px}
.banner{background:#fff4cc;border:2px dashed var(--prog);color:#7a4b00;border-radius:14px}
.summary div{border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line)}
.summary div:nth-child(1){background:var(--need-soft);border-color:#ffc2c4}
.summary div:nth-child(2){background:var(--host-soft);border-color:#a9ebcb}
.summary div:nth-child(3){background:var(--brand-soft);border-color:#d6ccff}
.summary b{font-size:30px;font-weight:800;line-height:1.1}
.summary div:nth-child(3) b{color:var(--brand)}
.pill{font-weight:800;border-radius:999px;padding:3px 10px}
.pill.prog{color:#8a5300}
.chip{background:#f6f1ff;border-radius:10px;font-weight:700}
.cell{border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);font-weight:700}
.cell.out{box-shadow:none;border:2px dashed #eadfcd}
.cell .big{font-weight:800}
.cell.short{background:#ffe9e9;border-color:#ff9ea1;box-shadow:0 3px 0 #ffc2c4}
.cell.ok{background:#e3f9ee;border-color:#7fdcae;box-shadow:0 3px 0 #b6edd2}
.cell.spare{background:#e4f0ff;border-color:#8cc0ff;box-shadow:0 3px 0 #c0dcff}
.cell.ph{background:#fff4cc;border-color:#ffe08a;box-shadow:0 3px 0 #ffeab0}
.cell.ph .big{color:#b07800}
.cell.sel{outline:3px solid var(--brand);outline-offset:2px}
.cell .mini i{border-radius:6px;padding:0 5px}
.wklabel{font-weight:800;color:var(--brand)}
.wkhead span{font-weight:800;color:var(--brand)}
.panel{border:2px solid var(--brand-soft);border-top:5px solid var(--brand);border-radius:18px;box-shadow:0 4px 0 var(--brand-soft)}
.plan{border:2px solid var(--line);border-radius:16px;box-shadow:0 2px 0 var(--line)}
.seg button{background:#f4efe6;box-shadow:0 2px 0 #e6ddcd;border-radius:10px;font-weight:800}
.seg button.on.need{box-shadow:0 2px 0 #d93a40}
.seg button.on.host{box-shadow:0 2px 0 #14955a}
.seg button.on.home{box-shadow:0 2px 0 #1c6fd6}
.seg button.on.away{box-shadow:0 2px 0 #8a2fc6}
.stepper button{box-shadow:0 2px 0 #a9ebcb}
.card.prog{border-left:6px solid var(--prog);background:linear-gradient(180deg,#fffaf0,#fff 40%)}
.card.spare{border-left:6px solid var(--home);background:linear-gradient(180deg,#f2f8ff,#fff 40%)}
.code{background:var(--brand-soft);color:var(--brand);border:2px dashed #c4b5fd;font-weight:800;border-radius:12px}
.err{border:2px solid #ffc2c4;border-radius:14px;font-weight:700}
.toggle{font-weight:700}
input[type=checkbox]{accent-color:var(--brand);width:18px;height:18px}

.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;font:800 20px "Baloo 2",Nunito,sans-serif;flex:none}
.card.sitter{border-left:6px solid var(--pink)}
.card.flagged{border-color:#ffc2c4;background:#fff7f7}
.sitters-intro{background:linear-gradient(180deg,#fff0f7,#fff 50%)}
a.btn{display:inline-block;text-decoration:none;font-weight:800;border-radius:14px;padding:8px 13px;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-dark)}
a.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:0 3px 0 var(--brand-soft);padding:6px 11px}
.availgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:6px 0}
.avd{background:#f4efe6;color:var(--ink);box-shadow:0 2px 0 #e6ddcd;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;border-radius:10px}
.avd small{font-size:10px;color:var(--muted)}
.avd.on{background:var(--home);color:#fff;box-shadow:0 2px 0 #1c6fd6}.avd.on small{color:#e3efff}
nav button{font-size:11px}

};

      const hi = holidays.reduce((a, h) => (!a || h.end_date > a ? h.end_date : a), null);
      let plans = [], progs = [], bookings = [];
      if (lo && fids.length) {
        plans = ok(await sb.from('day_plans').select('*').in('family_id', fids).gte('date', lo).lte('date', hi));
        if (kidIds.length) progs = ok(await sb.from('kid_programmes').select('*').in('kid_id', kidIds).gte('date', lo).lte('date', hi));
        bookings = await soft(sb.from('care_bookings').select('*').eq('group_id', gid).gte('date', D.add(D.today(), -14)), []);
      }
      const notes = kidIds.length ? await soft(sb.from('kid_notes').select('*').in('kid_id', kidIds), []) : [];
      const pubHols = await soft(sb.from('public_holidays').select('*').eq('country', country || 'NZ'), []);
      let sitters = [], vouches = [], avail = [], flags = [], sittersMissing = false;
      try {
        sitters = ok(await sb.from('sitters').select('*').eq('group_id', gid).order('created_at'));
        const sids = sitters.map(x => x.id);
        if (sids.length) {
          vouches = ok(await sb.from('sitter_vouches').select('*').in('sitter_id', sids));
          avail = lo ? ok(await sb.from('sitter_availability').select('*').in('sitter_id', sids).gte('date', lo).lte('date', hi)) : [];
          flags = ok(await sb.from('sitter_flags').select('*').in('sitter_id', sids));
        }
      } catch (e) { sittersMissing = true; }
      return { holidays, families, kids, plans, progs, bookings, notes, pubHols, sitters, vouches, avail, flags, sittersMissing };
    },
    async saveHolidays(gid, list) {
      ok(await sb.from('group_holidays').delete().eq('group_id', gid).eq('kind', 'holiday'));
      if (list.length) ok(await sb.from('group_holidays').insert(list.map(h => ({ group_id: gid, name: h.name, start_date: h.start_date, end_date: h.end_date, note: h.note || null, kind: 'holiday' }))));

      const row = { name: x.name, phone: x.phone || null, email: x.email || null, rate: x.rate || null, max_kids: x.max_kids || null, area: x.area || null, notes: x.notes || null, first_aid: !!x.first_aid, record_check: !!x.record_check };
      if (x.id) { ok(await sb.from('sitters').update(row).eq('id', x.id)); return; }
      const d = ok(await sb.from('sitters').insert({ ...row, group_id: x.group_id, added_by: x.added_by }).select().single());

      const templates = await soft(sb.from('holiday_templates').select('*').eq('country', provider.country).gte('end_date', D.today()).order('start_date'), []);
      return { provider, locations, sessions, stats, demand, templates };

    async deleteSession(id) { ok(await sb.from('provider_sessions').delete().eq('id', id)); },
    async checkout(plan, term) {
      if (!CONFIG.SERVER_READY) throw new Error('Card payments aren\'t switched on yet. Contact the Co-hortdinate team to upgrade.');
      const res = await fetch(FUNCTIONS_URL + '/checkout', { method: 'POST', headers: { Authorization: 'Bearer ' + await this.accessToken(), 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY }, body: JSON.stringify({ plan, term }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Payment could not start');
      location.href = d.url;
    },

    async adminProviders() { return ok(await sb.rpc('admin_providers')); },

  };

        db.care_bookings.forEach(b => { if (b.kid_id === kid.id && b.date === date && b.host_family === hostId && ['requested', 'offered'].includes(b.status)) b.status = 'cancelled'; });

function indexGroup(raw) {
  const g = { ...raw, planMap: {}, progMap: {}, famById: {}, ph: {} };
  raw.families.forEach(f => g.famById[f.id] = f);
  raw.plans.forEach(p => g.planMap[p.family_id + '|' + p.date] = { part: 'full', ...p });
  raw.progs.forEach(p => g.progMap[p.kid_id + '|' + p.date] = p);
  const group = S.groups.find(x => x.id === S.groupId);
  (raw.pubHols || []).filter(h => !h.region || h.region === group?.region).forEach(h => g.ph[h.date] = h.name);
  g.bookings = raw.bookings || [];
  g.notes = Object.fromEntries((raw.notes || []).map(n => [n.kid_id, n]));
  g.sitters = raw.sitters || []; g.vouches = raw.vouches || []; g.flags = raw.flags || [];
  g.availSet = new Set((raw.avail || []).map(a => a.sitter_id + '|' + a.date));
  g.kidById = Object.fromEntries(raw.kids.map(k => [k.id, k]));
  return g;
}

  if (!S.groupId) { S.g = null; return; }

}

function daySummary(date) {
  const g = S.g, need = [], hosts = [], home = [], away = [], unset = [], progs = [];
  const conf = g.bookings.filter(b => b.date === date && b.status === 'confirmed');
  for (const f of g.families) {
    const fk = g.kids.filter(k => k.family_id === f.id);
    const p = g.planMap[f.id + '|' + date];
    if (!p) { if (fk.length) unset.push(f); continue; }
    if (p.status === 'need') {
      for (const k of fk) {
        if (g.progMap[k.id + '|' + date]) continue;
        const open = partSlots(p.part).filter(sl => !conf.some(b => b.kid_id === k.id && partsOverlap(b.part, sl)));
        if (open.length) need.push({ k, f, slots: open, part: open.length === 2 ? 'full' : open[0] });
      }
    } else if (p.status === 'host') {
      const rem = {};
      for (const sl of partSlots(p.part)) rem[sl] = Math.max(0, (p.capacity || 0) - conf.filter(b => b.host_family === f.id && partsOverlap(b.part, sl)).length);
      hosts.push({ f, p, rem, left: Math.max(...Object.values(rem)) });
    } else if (p.status === 'home') home.push(f);
    else away.push(f);
  }
  for (const k of g.kids) { const pr = g.progMap[k.id + '|' + date]; if (pr) progs.push({ k, f: g.famById[k.family_id], pr }); }
  const slot = sl => ({ need: need.filter(x => x.slots.includes(sl)).length, spots: hosts.reduce((a, h) => a + (h.rem[sl] || 0), 0) });
  const am = slot('am'), pm = slot('pm');
  const short = Math.max(0, am.need - am.spots, pm.need - pm.spots);
  const spare = Math.max(0, am.spots - am.need, pm.spots - pm.need);
  const spots = Math.max(am.spots, pm.spots);
  const sparePart = (am.spots - am.need) === (pm.spots - pm.need) ? '' : (am.spots - am.need) > (pm.spots - pm.need) ? 'am' : 'pm';
  const byHost = {};
  conf.forEach(b => (byHost[b.host_family] ||= []).push(b));
  const pending = activeBookings(date).filter(b => b.status !== 'confirmed');
  return { need, hosts, home, away, unset, progs, spots, spare, sparePart, short, am, pm, byHost, pending };
}

// Programmes near me, ranked: friends going, interest + age match, plan, distance
function rankedNear() {
  const kids = myKids(), p = period();
  const friendsGoing = pr => {
    const ids = new Set(S.g.progs.filter(x => (x.provider_id === pr.id || x.programme.trim().toLowerCase() === pr.name.trim().toLowerCase()) &&
      (!p || (x.date >= p.start_date && x.date <= p.end_date)) && S.g.kidById[x.kid_id]?.family_id !== S.family.id).map(x => x.kid_id));
    return ids.size;
  };
  return (S.near || []).map(pr => {
    const reasons = [];
    let match = 0;
    for (const k of kids) {
      const a = ageOn(k, D.today());
      if (a != null && (a < pr.age_min || a > pr.age_max)) continue;
      const common = (k.interests || []).filter(t => (pr.tags || []).includes(t));
      if (common.length) { match += common.length; reasons.push(`${esc(k.first_name)}: ${common.map(t => INTEREST[t]?.l).filter(Boolean).join(', ')}`); }
    }
    const friends = friendsGoing(pr);
    const score = friends * 3 + match + (pr.plan === 'featured' ? 2.5 : pr.plan === 'standard' ? 1 : 0) - pr.distance_km / 15;
    return { ...pr, reasons, friends, score };
  }).sort((a, b) => b.score - a.score);
}

// ───────────── Calendar ─────────────
function inboxCard() {
  const inbox = myInbox(), declines = recentDeclines();
  if (!inbox.length && !declines.length) return '';
  const fam = id => esc(S.g.famById[id]?.name || 'A family');
  return `<div class="card inbox"><h2>📬 Needs your answer</h2>
    ${inbox.map(bs => { const b = bs[0], kids = listNames(bs.map(x => esc(S.g.kidById[x.kid_id]?.first_name || ''))), ids = bs.map(x => x.id).join(',');
      return `<div class="kidrow"><div class="grow">${b.status === 'requested'
        ? `<b>${fam(b.child_family)}</b> asked if you can look after <b>${kids}</b>`
        : `<b>${fam(b.host_family)}</b> offered to look after <b>${kids}</b>`}
        <div class="muted">${D.long(b.date)}${partSuffix(b.part)}${b.note ? ` · “${esc(b.note)}”` : ''}</div></div>
        <div class="flex col"><button data-a="respond" data-v="${ids}" data-ok="1">Accept</button><button class="link" data-a="respond" data-v="${ids}" data-ok="0">Not this time</button></div></div>`; }).join('')}
    ${declines.map(bs => { const b = bs[0], ids = bs.map(x => x.id).join(',');
      return `<div class="kidrow"><div class="grow"><b>${fam(b.host_family === S.family.id ? b.child_family : b.host_family)}</b> can't make <b>${D.short(b.date)}</b> this time.
        <button class="link" data-a="gotoDay" data-v="${b.date}" style="padding-left:0">See who else has room →</button></div><button class="link" data-a="dismiss" data-v="${ids}">✕</button></div>`; }).join('')}
  </div>`;
}
function viewCalendar() {
  const p = period(), days = periodDays();
  const sums = days.map(d => [d, daySummary(d)]);
  const shortDays = sums.filter(([, s]) => s.short > 0).length;
  const okDays = sums.filter(([, s]) => (s.need.length || Object.keys(s.byHost).length) && !s.short).length;
  const withKids = S.g.families.filter(f => S.g.kids.some(k => k.family_id === f.id));
  const filled = withKids.filter(f => days.some(d => S.g.planMap[f.id + '|' + d])).length;
  // spare spots list
  const offers = {};
  for (const [d, sm] of sums) {
    if (sm.spare <= 0) continue;
    const hostNames = sm.hosts.filter(h => h.left > 0).map(h => h.f.name).sort().join(', ');
    const notes = sm.hosts.filter(h => h.p.note).map(h => h.p.note).join('; ');
    const key = sm.spare + '|' + sm.sparePart + '|' + hostNames + '|' + notes;
    (offers[key] ||= { free: sm.spare, part: sm.sparePart, hostNames, notes, mine: sm.hosts.some(h => h.f.id === S.family.id), dates: [] }).dates.push(d);
  }
  const offerRows = Object.values(offers).flatMap(o => runs(o.dates).map(r => ({ ...o, r }))).sort((a, b) => a.r.start.localeCompare(b.r.start));
  const spareDays = sums.filter(([, sm]) => sm.spare > 0).length;
  const spareCard = offerRows.length ? `<div class="card spare">
      <div class="flex"><h2 class="grow" style="margin:0">Spare spots</h2><span class="pill spare">${spareDays} day${spareDays > 1 ? 's' : ''}</span></div>
      <p class="muted">Still planning your leave? These days already have friends home with room for more kids.</p>
      ${(S.showAllOffers ? offerRows : offerRows.slice(0, 4)).map(o => `<div class="kidrow"><div class="grow"><b>${runLabel(o.r)}</b><div><span class="pill spare">${o.free} spare spot${o.free > 1 ? 's' : ''}${partSuffix(o.part)}</span> <span class="muted">with ${esc(o.hostNames)}${o.notes ? ' · ' + esc(o.notes) : ''}</span></div></div>${o.mine ? '<span class="pill ph">incl. you</span>' : ''}</div>`).join('')}
      ${offerRows.length > 4 ? `<button class="link" data-a="toggleOffers">${S.showAllOffers ? 'Show fewer' : `Show all ${offerRows.length}`}</button>` : ''}
    </div>` : '';
  let html = inboxCard() + `<div class="summary"><div><b style="color:var(--need)">${shortDays}</b><span class="muted">days short</span></div>
    <div><b style="color:var(--host)">${okDays}</b><span class="muted">days covered</span></div>
    <div><b>${filled}/${withKids.length}</b><span class="muted">families filled in</span></div></div>
    ${p.note ? `<p class="muted" style="margin:-4px 0 10px">${esc(p.note)}</p>` : ''}
    ${p.kind === 'oneoff' ? `<p class="muted" style="margin:-4px 0 10px">One-off day added by ${esc(S.g.famById[p.created_by]?.name || 'the group')}.</p>` : ''}
    ${spareCard}
    <div class="legend"><span class="pill need">● need care</span><span class="pill host">● spare spots</span><span class="pill prog">● at programmes</span><span class="pill ph">🎌 public holiday</span><span class="pill ph">−2 short · ✓ covered · +2 spare</span></div>
    ${weekendToggle()}`;
  const sumMap = Object.fromEntries(sums);
  const cols = S.showWeekends || isOneoff() ? 7 : 5;
  let wk = D.add(p.start_date, -((D.dow(p.start_date) + 6) % 7));
  html += `<div class="wkhead" style="grid-template-columns:${cols === 7 ? 40 : 56}px repeat(${cols},minmax(0,1fr))"><span></span>${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].slice(0, cols).map(x => `<span>${x}</span>`).join('')}</div>`;
  let first = true;
  while (wk <= p.end_date) {
    const wdays = Array.from({ length: cols }, (_, i) => D.add(wk, i));
    const inP = wdays.filter(d => d >= p.start_date && d <= p.end_date);
    if (!inP.some(d => sumMap[d])) { wk = D.add(wk, 7); continue; }
    const wShort = inP.filter(d => sumMap[d]?.short).length;
    html += `<div class="week" style="grid-template-columns:${cols === 7 ? 40 : 56}px repeat(${cols},minmax(0,1fr))">
      <div class="wklabel">${D.parse(wk).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', timeZone: 'UTC' })}${wShort ? `<small class="pill need">${wShort} short</small>` : ''}</div>`;
    for (const d of wdays) {
      const s = sumMap[d];
      if (d < p.start_date || d > p.end_date || !s) { html += '<div class="cell out"></div>'; continue; }
      const hol = ph(d);
      const arranged = Object.values(s.byHost).flat().length;
      const cls = s.short ? 'short' : (s.need.length || arranged) ? 'ok' : s.spare > 0 ? 'spare' : hol ? 'ph' : 'quiet';
      const num = D.parse(d).getUTCDate();
      const mon = first || num === 1 ? `<small>${D.mon(d)}</small>` : '';
      first = false;
      const pend = s.pending.some(b => (b.status === 'requested' && b.host_family === S.family.id) || (b.status === 'offered' && b.child_family === S.family.id));
      html += `<button class="cell ${cls} ${S.openDay === d ? 'sel' : ''}" data-a="openDay" data-v="${d}" title="${esc(hol || '')}">
        <span class="n">${num}${mon}${pend ? '<i class="dot"></i>' : ''}</span>
        <span class="big">${s.short ? '−' + s.short : (s.need.length || arranged) ? '✓' : s.spare > 0 ? '+' + s.spare : hol ? '🎌' : ''}</span>
        <span class="mini">${s.need.length ? `<i class="dn">${s.need.length}</i>` : ''}${s.spots ? `<i class="ds">${s.spots}</i>` : ''}${s.progs.length ? `<i class="dp">${s.progs.length}</i>` : ''}</span>
      </button>`;
    }
    html += '</div>';
    if (S.openDay && wdays.includes(S.openDay) && sumMap[S.openDay]) html += dayDetail(S.openDay, sumMap[S.openDay]);
    wk = D.add(wk, 7);
  }
  return html;
}

function dayDetail(d, s) {
  const me = S.family.id, fam = f => esc(f.name), future = d >= D.today();
  const hol = ph(d);
  const kidsOf = ids => listNames(ids.map(id => esc(S.g.kidById[id]?.first_name || '')));
  // group need by family
  const needBy = {};
  s.need.forEach(x => (needBy[x.f.id] ||= { f: x.f, items: [] }).items.push(x));
  const myOpen = s.need.filter(x => x.f.id === me);
  const byProg = {};
  s.progs.forEach(x => (byProg[x.pr.programme] ||= []).push(x));
  const nearToday = (S.near || []).length ? rankedNear().filter(pr => pr.plan !== 'basic' && runsOn(pr, d)).slice(0, 3) : [];
  const sitters = sittersOn(d);
  return `<div class="detail panel">
    <div class="flex"><b class="grow">${D.long(d)}${hol ? ` <span class="pill ph">🎌 ${esc(hol)}</span>` : ''}</b><button class="link" data-a="openDay" data-v="${d}">Close</button></div>
    <div class="chips" style="margin-top:4px">${s.short ? `<span class="pill need">${s.short} kid${s.short > 1 ? 's' : ''} without a spot</span>` : ''}${(s.need.length && !s.short) ? '<span class="pill host">Enough spots for everyone</span>' : ''}${s.spare > 0 ? `<span class="pill spare">${s.spare} spare spot${s.spare > 1 ? 's' : ''}${partSuffix(s.sparePart)}</span>` : ''}${!s.need.length && !s.spare && !Object.keys(s.byHost).length ? '<span class="muted">No one needs care (yet)</span>' : ''}</div>

    ${s.need.length ? `<h4>Still need care</h4>${Object.values(needBy).map(({ f, items }) => {
      const kidsHtml = items.map(x => `<span class="chip">${kidName(x.k, d)}${x.part !== 'full' ? ` <small>· ${PARTS[x.part].toLowerCase()}</small>` : ''}</span>`).join('');
      const form = S.form && S.form.date === d && S.form.type === 'offer' && S.form.fam === f.id ? offerForm(d, f, items) : '';
      return `<div class="needrow"><div class="flex" style="flex-wrap:wrap"><b>${fam(f)}</b>${kidsHtml}<span class="grow"></span>
        ${future && f.id !== me && !form ? (s.pending.some(b => b.host_family === me && b.child_family === f.id && b.status === 'offered') ? '<span class="pill ph">⏳ Offer sent</span>' : `<button class="small" data-a="openForm" data-t="offer" data-d="${d}" data-v="${f.id}">🙋 I'll take them</button>`) : ''}
        ${future && f.id === me ? `<button class="small urgent" data-a="urgent" data-d="${d}">🚨 Urgent call</button>` : ''}</div>${form}</div>`;
    }).join('')}` : ''}

    ${s.hosts.length ? `<h4>Hosting</h4>${s.hosts.map(h => {
      const form = S.form && S.form.date === d && S.form.type === 'ask' && S.form.host === h.f.id ? askForm(d, h, myOpen) : '';
      return `<div class="needrow"><div class="flex" style="flex-wrap:wrap"><span class="chip"><b>${fam(h.f)}</b> — ${h.left} of ${h.p.capacity} spot${h.p.capacity === 1 ? '' : 's'} left${partSuffix(h.p.part)}${h.p.note ? ` <small>· ${esc(h.p.note)}</small>` : ''}</span><span class="grow"></span>
        ${future && myOpen.length && h.f.id !== me && h.left > 0 && !form ? (s.pending.some(b => b.host_family === h.f.id && b.child_family === me && b.status === 'requested') ? '<span class="pill ph">⏳ Asked</span>' : `<button class="small ghost" data-a="openForm" data-t="ask" data-d="${d}" data-v="${h.f.id}">Ask ${fam(h.f)}</button>`) : ''}</div>${form}</div>`;
    }).join('')}` : ''}

    ${Object.keys(s.byHost).length ? `<h4>Sorted ✓</h4>${Object.entries(s.byHost).map(([hid, bs]) => {
      const iHost = hid === me, ids = bs.map(b => b.id);
      return `<div class="needrow"><div class="flex" style="flex-wrap:wrap"><span class="chip">🏠 <b>${esc(S.g.famById[hid]?.name)}</b> has ${bs.map(b => `${kidName(S.g.kidById[b.kid_id] || { first_name: '?' }, d)}${b.part !== 'full' ? ` <small>${b.part.toUpperCase()}</small>` : ''}`).join(', ')}</span>
        ${iHost ? `<button class="link" data-a="showNotes" data-v="${ids.join(',')}">📋 Care notes</button>` : ''}</div>
        ${iHost && S.notesFor === ids.join(',') ? notesPanel(bs.map(b => b.kid_id)) : ''}</div>`;
    }).join('')}` : ''}
    ${s.pending.length ? `<p class="muted">⏳ Waiting to hear back: ${s.pending.map(b => `${esc(S.g.famById[b.status === 'requested' ? b.host_family : b.child_family]?.name)} (${esc(S.g.kidById[b.kid_id]?.first_name)})`).join(', ')}</p>` : ''}

    ${Object.keys(byProg).length ? `<h4>At programmes</h4>${Object.entries(byProg).map(([p, xs]) => `<div style="margin-bottom:4px"><span class="pill prog">${esc(p)}</span> ${xs.map(x => `<span class="chip">${kidName(x.k, d)} <small>· ${fam(x.f)}</small></span>`).join(' ')}</div>`).join('')}` : ''}
    ${nearToday.length && future ? `<h4>Programmes running near you</h4><div class="chips">${nearToday.map(pr => `<span class="chip">🎨 <b>${esc(pr.name)}</b>${pr.plan === 'featured' ? ' <small class="feat">Featured</small>' : ''} <small>· ${pr.distance_km} km</small></span>`).join('')}</div><button class="link" data-a="tab" data-v="progs" style="padding-left:0">See programmes →</button>` : ''}
    ${sitters.length ? `<h4>Sitters free this day ${s.short ? `<span class="pill spare">${s.need.length} kids could share one</span>` : ''}</h4><div class="chips">${sitters.map(x => `<span class="chip">🧑‍🍼 <b>${esc(x.name)}</b>${x.rate ? ` <small>· ${esc(x.rate)}</small>` : ''}${x.max_kids ? ` <small>· up to ${x.max_kids} kids</small>` : ''}</span>`).join('')}</div><button class="link" data-a="tab" data-v="sitters" style="padding-left:0">See sitters & contact details →</button>` : ''}
    ${s.home.length ? `<h4>Home, not hosting</h4><div class="chips">${s.home.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
    ${s.away.length ? `<h4>Away</h4><div class="chips">${s.away.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
    ${s.unset.length ? `<h4 class="muted">Not filled in yet</h4><div class="chips">${s.unset.map(f => `<span class="chip">${fam(f)}</span>`).join('')}</div>` : ''}
  </div>`;
}
const partSelect = sel => `<select name="part">${Object.entries(PARTS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

function notesPanel(kidIds) {

function viewPlan() {

    <p class="muted" style="margin-top:8px">Holiday programme booked? <button class="link" data-a="tab" data-v="progs" style="padding:0">Add it on the Programmes tab →</button></p>
  </div>
  <h3 class="muted" style="margin:14px 2px 6px">Day by day</h3>
  ${weekendToggle()}`;
  for (const d of days) {
    const pl = S.g.planMap[fid + '|' + d];
    const hol = ph(d);
    const kp = kids.map(k => [k, S.g.progMap[k.id + '|' + d]]).filter(([, x]) => x);
    const conf = S.g.bookings.filter(b => b.date === d && b.status === 'confirmed' && (b.child_family === fid || b.host_family === fid));
    html += `<div class="plan"><div class="top">
      <div class="d">${D.short(d).replace(/ \w+$/, '')}<div class="muted" style="font-weight:400;font-size:11px">${hol ? '🎌 ' + esc(hol) : D.mon(d)}</div></div>
      <div class="seg grow">${Object.entries(STATUS).map(([k, v]) => `<button class="${k} ${pl?.status === k ? 'on' : ''}" data-a="setStatus" data-d="${d}" data-v="${k}">${v.short}</button>`).join('')}
      ${pl ? `<button class="x" data-a="clearStatus" data-d="${d}" title="Clear">✕</button>` : ''}</div>
    </div>
    ${pl && ['need', 'host'].includes(pl.status) ? `<div class="partrow">${Object.entries(PARTS).map(([k, v]) => `<button class="${pl.part === k ? 'on' : ''}" data-a="setPart" data-d="${d}" data-v="${k}">${v}</button>`).join('')}</div>` : ''}
    ${pl?.status === 'host' ? `<div class="hostrow"><span class="muted">Extra kids:</span><div class="stepper"><button data-a="cap" data-d="${d}" data-v="-1">−</button><b>${pl.capacity}</b><button data-a="cap" data-d="${d}" data-v="1">+</button></div>
      <input class="grow" data-c="note" data-d="${d}" value="${esc(pl.note || '')}" maxlength="140" placeholder="Note, e.g. till 3pm, beach trip"></div>` : ''}
    ${kp.length || conf.length ? `<div class="chips" style="margin-top:6px">${kp.map(([k, x]) => `<span class="pill prog">${esc(k.first_name)} @ ${esc(x.programme)}</span>`).join('')}${conf.map(b => `<span class="pill host">${b.host_family === fid ? `Hosting ${esc(S.g.kidById[b.kid_id]?.first_name)}` : `${esc(S.g.kidById[b.kid_id]?.first_name)} → ${esc(S.g.famById[b.host_family]?.name)}`}${partSuffix(b.part)}</span>`).join('')}</div>` : ''}
    </div>`;
  }
  return html;
}

function withRef(u) { try { const x = new URL(u); x.searchParams.set('ref', 'cohortdinate'); return x.toString(); } catch { return u; } }

function viewProgrammes() {

      const dates = [...new Set(pg.rows.map(r => r.date))].sort();
      const kidsIn = new Set(pg.rows.map(r => r.kid_id));
      return `<div class="card prog"><div class="flex"><h2 class="grow" style="margin:0">${esc(pg.name)}</h2><span class="pill prog">${kidsIn.size} kid${kidsIn.size > 1 ? 's' : ''}</span></div>

        <div style="margin-top:8px"><button class="ghost" data-a="bookSame" data-v="${esc(pg.name)}" data-pid="${pg.pid || ''}" data-from="${dates[0]}" data-to="${dates[dates.length - 1]}">Book my kids for these days</button></div>
      </div>`;

}
function bookingSection(p) {
  const kids = myKids();
  if (!kids.length) return '';
  const names = [...new Set(S.g.progs.map(x => x.programme).concat((S.near || []).map(x => x.name)))].sort();
  const mine = S.g.progs.filter(x => kids.some(k => k.id === x.kid_id) && x.date >= p.start_date && x.date <= p.end_date);
  const groups = {};
  mine.forEach(x => (groups[x.kid_id + '|' + x.programme] ||= []).push(x));
  const rows = Object.entries(groups).flatMap(([key, xs]) => {
    const kidId = key.slice(0, key.indexOf('|')), prog = key.slice(key.indexOf('|') + 1);
    const k = kids.find(k => k.id === kidId);
    return runs(xs.map(x => x.date)).map(r => {
      const ids = xs.filter(x => r.dates.includes(x.date)).map(x => x.id);
      return `<div class="kidrow"><div class="grow"><b>${esc(k.first_name)}</b> · ${esc(prog)}<div class="muted">${runLabel(r)} · ${r.dates.length} day${r.dates.length > 1 ? 's' : ''}</div></div><button class="danger" data-a="delProgs" data-v="${ids.join(',')}">Remove</button></div>`;
    });
  });
  return `<div class="sectionhead"><h2>Your programme bookings</h2></div><div class="card prog">
    <p class="muted">Booked a holiday programme or other arrangement (like grandparents)? Add it here so those days don't count as needing care, and friends can book alongside.</p>
    <form data-f="addProg" id="progForm">
      <input type="hidden" name="provider_id">
      <label>Which kids</label><div class="flex" style="flex-wrap:wrap">${kids.map(k => `<label class="toggle" style="margin:0 10px 0 0"><input type="checkbox" name="kid" value="${k.id}" checked> ${esc(k.first_name)}</label>`).join('')}</div>
      <label>Programme or arrangement</label><input name="programme" list="progNames" required maxlength="80" placeholder="e.g. Kelly Club Mt Albert">
      <datalist id="progNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="grid2"><div><label>From</label><input type="date" name="from" required min="${p.start_date}" max="${p.end_date}"></div>
      <div><label>To</label><input type="date" name="to" required min="${p.start_date}" max="${p.end_date}"></div></div>
      <label class="toggle" style="margin-top:8px"><input type="checkbox" name="weekdays" checked> Weekdays only, skip public holidays</label>
      <button>Add booking</button>
    </form>
    ${rows.length ? `<h3>Booked in ${esc(p.name)}</h3>${rows.join('')}` : ''}
  </div>`;
}

// ───────────── Actions ─────────────
async function run(fn, reload = true) {
  S.error = '';
  try { await fn(); if (reload) { if (S.pv) S.pv = await API.loadProvider(S.providerId); else await reloadGroup(); } }
  catch (e) { S.error = e.message || String(e); scrollTo(0, 0); }
  render();
}
function setPlanLocal(row) { S.g.planMap[row.family_id + '|' + row.date] = row; }
const ids = el => el.dataset.v.split(',').filter(Boolean);

function buildIcs() {
  const me = S.family.id, ev = [];
  const groups = {};
  S.g.bookings.filter(b => b.status === 'confirmed' && (b.child_family === me || b.host_family === me)).forEach(b => {
    const k = b.date + '|' + b.part + '|' + (b.host_family === me ? 'h' : b.host_family); (groups[k] ||= []).push(b);
  });
  Object.values(groups).forEach(bs => { const b = bs[0], kids = bs.map(x => S.g.kidById[x.kid_id]?.first_name).join(' & ');
    ev.push({ date: b.date, uid: 'b-' + bs.map(x => x.id).join('-'), title: b.host_family === me ? `Hosting: ${bs.map(x => `${S.g.kidById[x.kid_id]?.first_name} (${S.g.famById[x.child_family]?.name})`).join(', ')}${partSuffix(b.part)}` : `${kids} → ${S.g.famById[b.host_family]?.name}${partSuffix(b.part)}` }); });
  const pg = {};
  S.g.progs.filter(x => S.g.kidById[x.kid_id]?.family_id === me).forEach(x => (pg[x.date + '|' + x.programme] ||= []).push(x));
  Object.values(pg).forEach(xs => ev.push({ date: xs[0].date, uid: 'p-' + xs.map(x => x.id).join('-'), title: `${xs.map(x => S.g.kidById[x.kid_id]?.first_name).join(' & ')} @ ${xs[0].programme}` }));
  const e = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Co-hortdinate//EN', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${e('Co-hortdinate — ' + S.family.name)}`];
  ev.forEach(x => lines.push('BEGIN:VEVENT', `UID:${x.uid.slice(0, 200)}@cohortdinate`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${x.date.replaceAll('-', '')}`, `DTEND;VALUE=DATE:${D.add(x.date, 1).replaceAll('-', '')}`, `SUMMARY:${e(x.title)}`, 'TRANSP:TRANSPARENT', 'END:VEVENT'));
  lines.push('END:VCALENDAR');
  return { text: lines.join('\r\n'), count: ev.length };
}

const actions = {
  tab(el) { S.tab = el.dataset.v; store.set('hh-tab', S.tab); S.openDay = null; S.form = null; render(); scrollTo(0, 0); },
  openDay(el) { S.openDay = S.openDay === el.dataset.v ? null : el.dataset.v; S.form = null; S.notesFor = null; render(); },
  gotoDay(el) { const d = el.dataset.v; const p = S.g.holidays.find(h => h.kind !== 'oneoff' && d >= h.start_date && d <= h.end_date) || S.g.holidays.find(h => d >= h.start_date && d <= h.end_date); if (p) S.periodId = p.id; S.tab = 'cal'; S.openDay = d; render(); },
  gotoPeriod(el) { S.periodId = el.dataset.v; S.tab = 'cal'; S.openDay = null; render(); scrollTo(0, 0); },
  toggleOffers() { S.showAllOffers = !S.showAllOffers; render(); },
  openForm(el) { S.form = { type: el.dataset.t, date: el.dataset.d, fam: el.dataset.v, host: el.dataset.v }; render(); },
  closeForm() { S.form = null; render(); },
  respond(el) { run(() => API.respondBookings(ids(el), el.dataset.ok === '1')); },
  cancelBooking(el) { if (confirm('Cancel this arrangement? The other family will get an email.')) run(() => API.cancelBookings(ids(el))); },
  dismiss(el) { ids(el).forEach(i => S.dismissed.add(i)); store.set('hh-dismissed', [...S.dismissed].slice(-200)); render(); },
  showNotes(el) { S.notesFor = S.notesFor === el.dataset.v ? null : el.dataset.v; render(); },
  urgent(el) {
    const d = el.dataset.d, s = daySummary(d), mine = s.need.filter(x => x.f.id === S.family.id);
    const part = mine.every(x => x.part === mine[0]?.part) ? (mine[0]?.part || 'full') : 'full';
    const msg = prompt(`Send an urgent call for help for ${D.short(d)}?\n\nEveryone in the group gets an email straight away. Add a short message (optional):`, '');
    if (msg === null) return;
    run(async () => { const n = await API.urgentCall(S.groupId, d, part, msg.trim()); toast(`🚨 Sent to ${n} famil${n === 1 ? 'y' : 'ies'}`); }, false);
  },
  setStatus(el) {
    const d = el.dataset.d, prev = S.g.planMap[S.family.id + '|' + d];
    const st = el.dataset.v;
    const row = { family_id: S.family.id, date: d, status: st, capacity: st === 'host' ? (prev?.capacity || 1) : 0, note: st === 'host' ? (prev?.note || '') : '', part: ['need', 'host'].includes(st) ? (prev?.part || 'full') : 'full' };
    setPlanLocal(row); render();
    run(() => API.upsertPlans([row]), false);
  },
  setPart(el) { const row = { ...S.g.planMap[S.family.id + '|' + el.dataset.d], part: el.dataset.v }; setPlanLocal(row); render(); run(() => API.upsertPlans([row]), false); },
  clearStatus(el) { const d = el.dataset.d; delete S.g.planMap[S.family.id + '|' + d]; render(); run(() => API.deletePlan(S.family.id, d), false); },
  cap(el) {
    const row = { ...S.g.planMap[S.family.id + '|' + el.dataset.d] };
    row.capacity = Math.max(0, Math.min(20, (row.capacity || 0) + Number(el.dataset.v)));
    setPlanLocal(row); render(); run(() => API.upsertPlans([row]), false);
  },
  bulkFill() {
    const status = document.getElementById('bulkStatus').value;
    const rows = periodDays(true).filter(d => (isOneoff() || !D.weekend(d)) && !ph(d) && !S.g.planMap[S.family.id + '|' + d])
      .map(d => ({ family_id: S.family.id, date: d, status, capacity: status === 'host' ? 1 : 0, note: '', part: 'full' }));
    if (!rows.length) { S.error = 'No empty days left to fill.'; render(); return; }
    rows.forEach(setPlanLocal);
    run(() => API.upsertPlans(rows));
  },
  delProgs(el) { run(() => API.deleteProgs(ids(el))); },
  bookSame(el) { S.prefill = { programme: el.dataset.v, provider_id: el.dataset.pid, from: el.dataset.from, to: el.dataset.to }; S.tab = 'progs'; render(); },
  clickProvider(el) { API.logProvider(el.dataset.v, 'click'); },
  addFromListing(el) {
    const pr = (S.near || []).find(x => x.id === el.dataset.v); const p = period();
    const s = (pr.sessions || []).find(s => p && s.end >= p.start_date && s.start <= p.end_date);
    S.prefill = { programme: pr.name, provider_id: pr.id, from: s ? (s.start < p.start_date ? p.start_date : s.start) : '', to: s ? (s.end > p.end_date ? p.end_date : s.end) : '' };
    render();
  },
  editKid(el) { S.editKid = el.dataset.v; S.notesFor = null; render(); },
  cancelKid() { S.editKid = null; render(); },
  editNotes(el) { S.notesFor = S.notesFor === 'kid:' + el.dataset.v ? null : 'kid:' + el.dataset.v; S.editKid = null; render(); },
  delKid(el) { const k = myKids().find(k => k.id === el.dataset.v); if (confirm(`Remove ${k.first_name}? Their programme bookings and arrangements will be removed too.`)) run(() => API.deleteKid(el.dataset.v)); },
  async copyInvite() {
    const g = S.groups.find(x => x.id === S.groupId);
    const text = `Join our school holiday group "${g.name}" on Co-hortdinate: ${location.origin + location.pathname}\nInvite code: ${g.invite_code}`;
    try { await navigator.clipboard.writeText(text); toast('Invite copied — paste it into your group chat.'); }
    catch { prompt('Copy this invite:', text); }
  },
  async copyCal() {
    const u = API.calendarUrl(S.family.calendar_token);
    try { await navigator.clipboard.writeText(u); toast('Calendar link copied — keep it private.'); } catch { prompt('Copy this link:', u); }
  },
  downloadIcs() {
    const { text, count } = buildIcs();
    if (!count) { toast('No arrangements or programme bookings to add yet.'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' })); a.download = 'co-hortdinate.ics';
    document.body.appendChild(a); a.click(); a.remove(); toast(`📅 ${count} event${count > 1 ? 's' : ''} downloaded`);
  },
  switchGroup(el) { S.groupId = el.dataset.v; store.set('hh-group', S.groupId); S.periodId = null; S.tab = 'cal'; run(() => Promise.resolve()); },
  editRegion() { S.editRegion = !S.editRegion; render(); },
  addHol() { document.getElementById('newHol').insertAdjacentHTML('beforeend', holRow({ name: '', start_date: '', end_date: '' })); },
  rmHol(el) { el.closest('[data-hol]').remove(); },
  resetHols() { if (confirm('Replace this group\'s school holiday dates with the official dates for your region? One-off days are kept.')) run(() => API.resetHolidays(S.groupId)); },
  delHoliday(el) { if (confirm('Remove this one-off day?')) run(() => API.deleteHoliday(el.dataset.v)); },
  leaveGroup() {
    if (!confirm('Leave this group? Your plan stays saved, but this group will no longer see it.')) return;
    run(async () => { await API.leaveGroup(S.groupId, S.family.id); const me = await API.getMe(); S.groups = me.groups; S.groupId = S.groups[0]?.id || null; });
  },
  signOut() { run(async () => { await API.signOut(); Object.assign(S, { user: null, family: null, groups: [], g: null, sentTo: null, pv: null, providerId: null }); }, false); },
  demoAs(el) { API.setDemoAs(el.dataset.v); S.pv = null; S.tab = el.dataset.v === 'family' ? 'group' : S.tab; boot(); scrollTo(0, 0); },
  // app admin
  openAdmin() { S.tab = 'admin'; S.adminList = null; render(); run(async () => { S.adminList = await API.adminProviders(); }, false); },
  adminEdit(el) { S.adminEdit = el.dataset.v || null; render(); },
  adminStatus(el) {
    const p = S.adminList.find(x => x.id === el.dataset.v), st = el.dataset.s;
    let note = p.review_note;
    if (st === 'rejected') { note = prompt('What should they fix? (This goes in the email to them.)', ''); if (note === null) return; }
    run(async () => { await API.adminUpdateProvider(p.id, st, p.plan, p.paid_until, note); S.adminList = await API.adminProviders(); }, false);
  },
  // provider portal
  delLocation(el) { run(() => API.deleteLocation(el.dataset.v)); },
  delSession(el) { run(() => API.deleteSession(el.dataset.v)); },
  quickSession(el) { run(() => API.addSession({ provider_id: S.providerId, start_date: el.dataset.a1, end_date: el.dataset.a2, note: el.dataset.n })); },
  checkout(el) { run(() => API.checkout(el.dataset.v, el.dataset.t)); },
  // sitters
  addSitter() { S.addingSitter = true; S.editSitter = null; render(); },
  editSitter(el) { S.editSitter = el.dataset.v; S.addingSitter = false; render(); scrollTo(0, 0); },
  cancelSitter() { S.addingSitter = false; S.editSitter = null; render(); },
  delSitter(el) { const x = S.g.sitters.find(y => y.id === el.dataset.v); if (confirm(`Remove ${x.name} from this group's sitters?`)) run(() => API.deleteSitter(x.id)); },
  vouch(el) {
    const x = S.g.sitters.find(y => y.id === el.dataset.v);
    const cur = S.g.vouches.find(v => v.sitter_id === x.id && v.family_id === S.family.id);
    const n = parseInt(prompt(`Only recommend ${x.name} if they've looked after your kids.\n\nHow many times have you used them?`, cur ? cur.times_used : '1'), 10);
    if (!n || n < 1) return;
    run(() => API.setVouch(x.id, S.family.id, Math.min(n, 999)));
  },
  unvouch(el) { run(() => API.setVouch(el.dataset.v, S.family.id, 0)); },
  flagSitter(el) {
    const x = S.g.sitters.find(y => y.id === el.dataset.v);
    const reason = prompt(`Flag ${x.name}?\n\nThis hides them from the whole group straight away and asks the group admin to review. What's the concern?`);
    if (!reason || !reason.trim()) return;
    run(() => API.flagSitter(x.id, reason.trim().slice(0, 500)));
  },
  restoreSitter(el) { run(() => API.restoreSitter(el.dataset.v)); },
  availFor(el) { S.availFor = S.availFor === el.dataset.v ? null : el.dataset.v; render(); },
  toggleAvail(el) {
    const key = el.dataset.v + '|' + el.dataset.d, on = !S.g.availSet.has(key);
    on ? S.g.availSet.add(key) : S.g.availSet.delete(key); render();
    run(() => API.setAvail(el.dataset.v, el.dataset.d, on), false);
  },
};

const checked = (f, name) => [...f.querySelectorAll(`input[name=${name}]:checked`)].map(i => i.value);
const forms = {
  async signin(f) {
    const email = f.email.value.trim(); S.busy = true; render();
    await run(async () => { await API.signIn(email); S.sentTo = email; }, false); S.busy = false; render();
  },
  async verify(f) { await run(async () => { await API.verify(S.sentTo, f.code.value.trim()); S.user = true; }, false); boot(); },
  async createFamily(f) { await run(() => API.createFamily(f.name.value.trim()), false); S.tab = 'family'; boot(); },
  async joinFamily(f) { await run(() => API.joinFamily(f.code.value.trim()), false); boot(); },
  async registerProvider(f) { await run(() => API.registerProvider(f.name.value.trim()), false); boot(); },
  async createGroup(f) {
    if (!f.region.value) { S.error = 'Pick your region so we can load the right holiday dates.'; render(); return; }
    await run(async () => { const g = await API.createGroup(f.name.value.trim(), f.country.value, f.region.value); S.groupId = g.id; store.set('hh-group', g.id); S.tab = 'family'; }, false); boot();
  },
  async joinGroup(f) { await run(async () => { const g = await API.joinGroup(f.code.value.trim()); S.groupId = g.id; store.set('hh-group', g.id); S.tab = 'family'; }, false); boot(); },
  renameFamily(f) { const name = f.name.value.trim(); run(async () => { await API.updateFamily(S.family.id, { name }); S.family.name = name; }); },
  setPlace(f) {
    const id = parseInt(f.place.value, 10);
    if (!id) { S.error = 'Pick your suburb or town.'; render(); return; }
    run(async () => { await API.updateFamily(S.family.id, { place_id: id }); S.family.place_id = id; S.regionPick = null; toast('📍 Saved'); });
  },
  saveKid(f) {
    const k = { id: f.id.value || undefined, family_id: S.family.id, first_name: f.first_name.value.trim(), birth_month: f.birth_month.value ? f.birth_month.value + '-01' : null, gender: f.gender.value || null, interests: checked(f, 'interest') };
    S.editKid = null; run(() => API.saveKid(k));
  },
  saveNotes(f) {
    const n = { kid_id: f.dataset.v, allergies: f.allergies.value.trim() || null, needs: f.needs.value.trim() || null, pickup: f.pickup.value.trim() || null, emergency: f.emergency.value.trim() || null, share_in_email: f.share_in_email.checked };
    S.notesFor = null; run(async () => { await API.saveNote(n); toast('📋 Care notes saved'); });
  },
  addProg(f) {
    const kidIds = checked(f, 'kid');
    const from = f.from.value, to = f.to.value, programme = f.programme.value.trim();
    if (!kidIds.length) { S.error = 'Pick at least one kid.'; render(); return; }
    if (to < from) { S.error = '"To" date is before "From".'; render(); return; }
    const match = (S.near || []).find(x => x.name.trim().toLowerCase() === programme.toLowerCase());
    const provider_id = f.provider_id.value || match?.id || null;
    const dates = D.range(from, to).filter(d => !f.weekdays.checked || (!D.weekend(d) && !ph(d)));
    const rows = kidIds.flatMap(kid_id => dates.map(date => ({ kid_id, date, programme, provider_id })));
    run(() => API.upsertProgs(rows));
  },
  saveHolidays(f) {
    const list = [...f.querySelectorAll('[data-hol]')].map(r => ({ name: r.querySelector('[name=hname]').value.trim(), start_date: r.querySelector('[name=hstart]').value, end_date: r.querySelector('[name=hend]').value, note: r.querySelector('[name=hnote]').value }));
    if (list.some(h => h.end_date < h.start_date)) { S.error = 'A holiday period ends before it starts.'; render(); return; }
    run(() => API.saveHolidays(S.groupId, list));
  },
  addOneoff(f) {
    const name = (f.kind.value || f.other.value.trim());
    if (!name) { S.error = 'Give the one-off day a name.'; render(); return; }
    const start = f.start.value, end = f.end.value || start;
    if (end < start) { S.error = '"Until" is before the start date.'; render(); return; }
    run(async () => { await API.addOneoff(S.groupId, name, start, end); toast('Added — pick it from the dates menu at the top'); });
  },
  saveRegion(f) { const region = f.region.value; S.editRegion = false; run(async () => { await API.updateGroup(S.groupId, { region }); S.groups.find(g => g.id === S.groupId).region = region; }); },
  offer(f) {
    const d = f.dataset.d, kidIds = checked(f, 'kid'), part = f.part.value, note = f.note.value.trim();
    run(async () => {
      const mine = S.g.planMap[S.family.id + '|' + d];
      if (mine?.status !== 'host' || (mine.capacity || 0) < kidIds.length) {
        await API.upsertPlans([{ family_id: S.family.id, date: d, status: 'host', capacity: Math.max(mine?.status === 'host' ? mine.capacity : 0, kidIds.length), note: mine?.note || '', part: mine?.status === 'host' ? mine.part : part }]);
      }
      await API.createBookings(S.groupId, d, part, kidIds, S.family.id, note);
      S.form = null;
    });
  },
  ask(f) {
    const d = f.dataset.d, kidIds = checked(f, 'kid'), part = f.part.value, note = f.note.value.trim();
    run(async () => { await API.createBookings(S.groupId, d, part, kidIds, f.dataset.host, note); S.form = null; toast('Asked — you\'ll get an email when they answer'); });
  },
  adminPlan(f) {
    const p = S.adminList.find(x => x.id === f.dataset.v);
    run(async () => { await API.adminUpdateProvider(p.id, p.status, f.plan.value, f.until.value || null, p.review_note); S.adminEdit = null; S.adminList = await API.adminProviders(); }, false);
  },
  saveProviderListing(f) {
    const patch = { name: f.name.value.trim(), about: f.about.value.trim() || null, website: f.website.value.trim() || null, booking_url: f.booking_url.value.trim() || null,
      email: f.email.value.trim() || null, phone: f.phone.value.trim() || null, age_min: parseInt(f.age_min.value, 10) || 0, age_max: parseInt(f.age_max.value, 10) || 18,
      price_text: f.price_text.value.trim() || null, nzbn: f.nzbn.value.trim() || null, offer_text: f.offer_text.value.trim() || null, oscar: f.oscar.checked, tags: checked(f, 'tag') };
    run(async () => { await API.saveProvider(S.providerId, patch); toast('Listing saved'); });
  },
  addLocation(f) {
    const place_id = parseInt(f.place.value, 10);
    if (!place_id) { S.error = 'Pick the suburb or town your venue is in.'; render(); return; }
    run(() => API.addLocation({ provider_id: S.providerId, place_id, venue: f.venue.value.trim() || null, radius_km: parseInt(f.radius.value, 10) }));
  },
  addSession(f) {
    if (f.end.value < f.start.value) { S.error = '"To" is before "From".'; render(); return; }
    run(() => API.addSession({ provider_id: S.providerId, start_date: f.start.value, end_date: f.end.value, note: f.note.value.trim() || null }));
  },
  saveSitter(f) {
    const x = { id: f.id.value || undefined, group_id: S.groupId, added_by: S.family.id, name: f.name.value.trim(), phone: f.phone.value.trim(), email: f.email.value.trim(),
      rate: f.rate.value.trim(), max_kids: f.max_kids.value ? Math.max(1, Math.min(20, parseInt(f.max_kids.value, 10))) : null, area: f.area.value.trim(), notes: f.notes.value.trim(),
      first_aid: f.first_aid.checked, record_check: f.record_check.checked, times_used: f.times_used ? parseInt(f.times_used.value, 10) || 1 : undefined };
    if (x.id) { delete x.group_id; delete x.added_by; }
    S.addingSitter = false; S.editSitter = null;
    run(() => API.saveSitter(x));
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !actions[el.dataset.a]) return;
  if (el.tagName !== 'A') e.preventDefault();
  actions[el.dataset.a](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!forms[f.dataset.f]) return;
  e.preventDefault(); forms[f.dataset.f](f);
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.c; if (!c) return;
  if (c === 'period') { S.periodId = el.value; S.openDay = null; S.form = null; render(); scrollTo(0, 0); }
  if (c === 'group') { S.groupId = el.value; store.set('hh-group', S.groupId); S.periodId = null; run(() => Promise.resolve()); }
  if (c === 'weekends') { S.showWeekends = el.checked; store.set('hh-weekends', S.showWeekends); render(); }
  if (c === 'note') { const row = { ...S.g.planMap[S.family.id + '|' + el.dataset.d], note: el.value.slice(0, 140) }; setPlanLocal(row); run(() => API.upsertPlans([row]), false); }
  if (c === 'regionPick') {
    // fill the suburb list in place, so other fields in the form keep what's typed
    const sel = el.form?.querySelector(`select[name="${el.dataset.v}"]`); if (!sel) return;
    (S.regionPick ||= {})[el.dataset.v] = el.value;
    const country = S.pv?.provider.country || 'NZ';
    sel.innerHTML = '<option value="">Choose…</option>' + S.places.filter(p => p.country === country && p.region === el.value).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    sel.disabled = !el.value;
  }
  if (c === 'autoAccept' || c === 'emailReminders') {
    const key = c === 'autoAccept' ? 'auto_accept' : 'email_reminders';
    S.family[key] = el.checked; run(() => API.updateFamily(S.family.id, { [key]: el.checked }), false);
  }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();

</script>
</body>
</html>
